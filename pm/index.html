<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Manager · Made Of</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='6' width='20' height='20' transform='rotate(45 16 16)' fill='%236aa9ff'/></svg>" />
<style>
  :root {
    --bg: #0b0d10;
    --fg: #d7dbe0;
    --fg-strong: #eee;
    --muted: #9ba3ad;
    --border: #2a2f36;
    --code-bg: #1a1e23;
    --pre-bg: #14181d;
    --link: #6aa9ff;
    --row-hover: rgba(255,255,255,0.04);
    --danger: #ff9c9c;
    --ok: #9cffc0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--border); gap: 12px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; color: var(--fg-strong); }
  header .brand { display: flex; align-items: baseline; gap: 20px; }
  header nav.app-nav { display: flex; gap: 14px; }
  header nav.app-nav a { color: var(--muted); font-size: 13px; font-weight: 500;
    text-decoration: none; padding: 4px 2px; border-bottom: 2px solid transparent; }
  header nav.app-nav a:hover { color: var(--fg); }
  header nav.app-nav a.active { color: var(--fg-strong); border-bottom-color: var(--link); }
  header .header-actions { display: flex; gap: 8px; }
  header .header-actions button { background: var(--link); color: #0b0d10; border: 0;
    border-radius: 4px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer;
    font-size: 12px; }
  header .header-actions button:hover { filter: brightness(1.1); }
  header .header-actions button.secondary { background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); }
  header .header-actions button.secondary:hover { background: var(--row-hover); }
  /* Header "needs review" chip: at-a-glance inbox count that also applies
     the Review=needs filter. Amber accent when there's work to look at,
     dim when count === 0, link-blue when the filter is already engaged. */
  header .header-actions .review-chip { background: rgba(255,180,80,0.12);
    color: #ffd08a; border: 1px solid rgba(255,180,80,0.35); border-radius: 999px;
    padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  header .header-actions .review-chip:hover { filter: brightness(1.1); }
  header .review-chip .chip-count { font-variant-numeric: tabular-nums; opacity: 0.9; }
  header .review-chip.zero { background: var(--code-bg); color: var(--muted);
    border-color: var(--border); }
  header .review-chip.zero .chip-count { opacity: 0.6; }
  header .review-chip.active { background: var(--link); color: #0b0d10;
    border-color: var(--link); }
  /* Header "pinned" chip: mirrors review-chip shape but uses a distinct
     accent (soft gold) so pinned ≠ needs-review at a glance. Personal
     shortlist marker; toggles the Pinned=only filter. */
  header .header-actions .pinned-chip { background: rgba(255,215,120,0.10);
    color: #ffe1a3; border: 1px solid rgba(255,215,120,0.30); border-radius: 999px;
    padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  header .header-actions .pinned-chip:hover { filter: brightness(1.1); }
  header .pinned-chip .chip-count { font-variant-numeric: tabular-nums; opacity: 0.9; }
  header .pinned-chip.zero { background: var(--code-bg); color: var(--muted);
    border-color: var(--border); }
  header .pinned-chip.zero .chip-count { opacity: 0.6; }
  header .pinned-chip.active { background: #ffd47a; color: #0b0d10; border-color: #ffd47a; }
  /* Per-row pin toggle: outline star when unpinned, filled gold when pinned.
     Sits in its own tiny cell so it doesn't fight the row-click. */
  .pin-btn { background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 2px; }
  .pin-btn:hover { color: #ffd47a; }
  .pin-btn.pinned { color: #ffd47a; }
  td.pin-cell { text-align: center; width: 22px; padding: 0 4px; }
  tr.pinned-row td.pin-cell { color: #ffd47a; }
  main { padding: 16px 24px 40px; }
  section { margin-top: 24px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  /* Tasks layout: [sidebar][table]. Sidebar sticky so it stays visible
     while the table scrolls. Collapsed → narrow icon strip. */
  .tasks-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
  .tasks-layout.collapsed { grid-template-columns: 36px 1fr; }
  .tasks-main { min-width: 0; }
  .sidebar { position: sticky; top: 12px; align-self: start;
    border: 1px solid var(--border); border-radius: 6px; background: var(--pre-bg);
    padding: 10px 12px 12px; max-height: calc(100vh - 24px); overflow-y: auto;
    scrollbar-width: thin; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .sidebar-header { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .sidebar-header .title { color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 11px; font-weight: 600; }
  .sidebar-toggle { background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer;
    line-height: 1; }
  .sidebar-toggle:hover { color: var(--fg-strong); border-color: var(--fg-strong); }
  .tasks-layout.collapsed .sidebar { padding: 8px 4px; }
  .tasks-layout.collapsed .sidebar-header { flex-direction: column; gap: 6px;
    margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
  .tasks-layout.collapsed .sidebar-header .title { display: none; }
  .tasks-layout.collapsed .filter-group,
  .tasks-layout.collapsed .sidebar-footer { display: none; }

  .filter-group { margin-top: 10px; }
  .filter-group:first-of-type { margin-top: 4px; }
  .filter-group label.group-label { display: block; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; font-weight: 600; }
  .filter-group select { width: 100%; background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 4px; font: inherit;
    font-size: 12px; }
  .filter-group select:focus { outline: none; border-color: var(--link); }
  .filter-group select[multiple] option { padding: 2px 6px; }
  .filter-group select[multiple] option:checked {
    background: var(--link) linear-gradient(0deg, var(--link), var(--link)); color: #0b0d10; }
  .filter-group .hint { color: var(--muted); font-size: 10px; margin-top: 2px; font-style: italic; }

  /* Tri-state listbox: replaces native <select multiple> for the axes that
     support include/exclude toggling. Click cycles unapplied → include → exclude
     → unapplied. Rendered as a scrollable stack of rows so we can paint the
     tri-state marker inline; native <option> can't carry three visual states. */
  .tri-list { width: 100%; background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; font: inherit;
    font-size: 12px; max-height: 168px; overflow-y: auto; padding: 2px; }
  .tri-list:focus-within { border-color: var(--link); outline: none; }
  .tri-row { display: flex; align-items: center; gap: 6px; padding: 2px 6px;
    cursor: pointer; user-select: none; border-radius: 3px; line-height: 1.5; }
  .tri-row:hover { background: var(--pre-bg); }
  .tri-row .tri-mark { flex: 0 0 12px; width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid var(--border); background: transparent; display: inline-flex;
    align-items: center; justify-content: center; color: transparent; font-size: 11px;
    line-height: 1; font-weight: 700; }
  .tri-row .tri-label { flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .tri-row .tri-count { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums;
    font-size: 11px; opacity: 0.75; }
  .tri-row.include { color: #0b0d10; background: var(--link); }
  .tri-row.include:hover { background: var(--link); filter: brightness(1.05); }
  .tri-row.include .tri-mark { border-color: #0b0d10; color: #0b0d10; background: transparent; }
  .tri-row.include .tri-mark::before { content: "✓"; }
  .tri-row.include .tri-count { color: #0b0d10; opacity: 0.75; }
  .tri-row.exclude { color: #ffb3b3; background: #2a1414; }
  .tri-row.exclude:hover { background: #3a1818; }
  .tri-row.exclude .tri-mark { border-color: var(--danger); color: var(--danger); background: transparent; }
  .tri-row.exclude .tri-mark::before { content: "−"; }
  .tri-row.exclude .tri-label { text-decoration: line-through; text-decoration-color: rgba(255,180,180,0.55); }
  .tri-row.exclude .tri-count { color: #ffb3b3; opacity: 0.75; }
  .sidebar-footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; }
  .sidebar-footer .match-count { color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace; }
  .sidebar-footer button { background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font: inherit;
    font-size: 12px; cursor: pointer; }
  .sidebar-footer button:hover:not(:disabled) { border-color: var(--fg-strong); color: var(--fg-strong); }
  .sidebar-footer button:disabled { opacity: 0.4; cursor: not-allowed; }
  .sidebar-footer button.active-clear { color: var(--danger); border-color: #5a1e1e; }
  .sidebar-footer button.active-clear:hover { background: #2a1414; color: var(--danger); }
  @media (max-width: 900px) {
    .tasks-layout { grid-template-columns: 1fr; }
    .tasks-layout.collapsed { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; }
  }

  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: nowrap;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
    padding: 2px 4px 6px 0; }
  .filters::-webkit-scrollbar { height: 6px; }
  .filters::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .filters::-webkit-scrollbar-track { background: transparent; }
  .chip { padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--code-bg); color: var(--fg); cursor: pointer; font-size: 12px; user-select: none;
    flex: 0 0 auto; white-space: nowrap; }
  .chip.active { background: var(--link); border-color: var(--link); color: #0b0d10;
    font-weight: 600; }
  .chip .chip-count { margin-left: 5px; opacity: 0.65; font-variant-numeric: tabular-nums; }
  .chip.active .chip-count { opacity: 0.9; color: #0b0d10; }
  .chip.zero:not(.active) { color: var(--muted); }
  .chip.zero:not(.active) .chip-count { opacity: 0.55; }
  /* Pin the first chip (the "clear" chip) so it stays visible while the row scrolls.
     A single label with a disabled state when there's nothing to clear. */
  .chip.sticky { position: sticky; left: 0; z-index: 1;
    background: #2a1414; color: #ffb3b3; border-color: var(--danger);
    font-weight: 600; box-shadow: 8px 0 8px -6px var(--bg); }
  .chip.sticky:hover { background: #3a1818; color: #ffd0d0; }
  .chip.sticky.disabled { background: var(--pre-bg); color: var(--muted);
    border-color: var(--border); border-style: dashed; cursor: not-allowed;
    font-weight: 400; }
  .chip.sticky.disabled:hover { background: var(--pre-bg); color: var(--muted); }

  .pager { display: flex; align-items: center; justify-content: flex-end;
    gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .pager button { background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .pager button:hover:not(:disabled) { border-color: var(--fg-strong); color: var(--fg-strong); }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager .pager-count { font-family: ui-monospace, SF Mono, Menlo, monospace; }

  .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .search-row input { flex: 1; background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font: inherit; }
  .search-row input:focus { outline: none; border-color: var(--link); }
  .search-count { color: var(--muted); font-size: 12px; font-family: ui-monospace, SF Mono, Menlo, monospace;
    white-space: nowrap; }

  .form { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 12px;
    padding: 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--pre-bg); }
  .form-row { display: contents; }
  .form input[type=text], .form select, .form textarea {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font: inherit; min-width: 0; width: 100%; }
  .form textarea { resize: vertical; min-height: 34px; grid-column: 1 / -1; }
  .form .grid { display: grid; gap: 8px 10px; grid-column: 1 / -1;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .form .field-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .form .field-cell label { color: var(--muted); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.05em; }
  .form button { background: var(--link); color: #0b0d10; border: 0; border-radius: 4px;
    padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .form button:hover { filter: brightness(1.1); }
  /* Legacy .inline still used by the changelog form (single-row of small fields). */
  .form .inline { display: flex; gap: 8px; grid-column: 1 / -1; flex-wrap: wrap; }
  .form .inline > * { flex: 1 1 140px; min-width: 0; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
    vertical-align: top; font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--fg-strong); }
  th.sortable .sort-arrow { color: var(--link); margin-left: 3px; }
  tbody tr:hover { background: var(--row-hover); }
  td.id { font-family: ui-monospace, SF Mono, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  td.title { color: var(--fg-strong); }

  /* Click-to-copy task id. Behaves as a small inline button; stops row-click
     propagation so it doesn't also open the modal. Copy icon appears on hover. */
  .copy-id { display: inline-flex; align-items: center; gap: 4px;
    font: inherit; color: inherit; cursor: pointer; user-select: none;
    padding: 1px 5px; margin: -1px -5px; border-radius: 3px;
    border: 1px solid transparent; transition: background 80ms, border-color 80ms, color 80ms; }
  .copy-id:hover { background: var(--code-bg); border-color: var(--border); color: var(--fg-strong); }
  .copy-id:focus-visible { outline: none; background: var(--code-bg);
    border-color: var(--link); color: var(--fg-strong); }
  .copy-id::after { content: "⧉"; font-size: 0.9em; opacity: 0; margin-left: 1px;
    transition: opacity 80ms; }
  .copy-id:hover::after, .copy-id:focus-visible::after { opacity: 0.7; }
  .copy-id.copied { color: #9cffc0; border-color: transparent; background: transparent; }
  .copy-id.copied::after { content: "✓"; opacity: 1; }

  select.status-select {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }
  .status-select.open        { color: #9ecbff; }
  .status-select.in_progress { color: #ffcf7a; }
  .status-select.blocked     { color: #ff9c9c; }
  .status-select.on_hold     { color: #c8a2ff; }
  .status-select.done        { color: #9cffc0; }
  .status-select.cancelled   { color: #9ba3ad; }
  .status-select.wont_do     { color: #7a828c; font-style: italic; }

  select.priority-select {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 11px;
    letter-spacing: 0.04em; font-weight: 600;
  }
  .priority-select.P0 { color: #ff9c9c; }
  .priority-select.P1 { color: #ffcf7a; }
  .priority-select.P2 { color: var(--fg); }
  .priority-select.P3 { color: var(--muted); }

  .group-pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px;
    background: rgba(106,169,255,0.12); color: var(--link); border: 1px solid rgba(106,169,255,0.25); }

  /* Review-state cell: leftmost column, tight width. */
  td.review, th.review { width: 22px; text-align: center; padding-left: 6px; padding-right: 6px; }
  .review-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ffcf7a; box-shadow: 0 0 6px rgba(255,207,122,0.5); vertical-align: middle; }
  .review-check { color: var(--ok); opacity: 0.55; font-size: 12px; line-height: 1; }
  .review-none { color: var(--border); font-size: 11px; }
  .modal-footer .secondary { background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px;
    font: inherit; cursor: pointer; }
  .modal-footer .secondary:hover { border-color: var(--fg-strong); color: var(--fg-strong); }
  .row-actions { display: flex; gap: 4px; }
  .icon-btn { background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px; font: inherit; font-size: 11px; cursor: pointer; }
  .icon-btn:hover { color: var(--fg-strong); border-color: var(--fg-strong); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  tbody tr.clickable { cursor: pointer; }

  /* Each comment is a bordered card so entries stay visually distinct even
     when their bodies contain rich markdown (headings, lists, code blocks). */
  .comment { background: var(--pre-bg); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .comment:last-child { margin-bottom: 0; }
  .comment-header { display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--code-bg); border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    cursor: pointer; user-select: none; }
  .comment-header:hover { background: var(--pre-bg); }
  .comment-header .collapse-arrow { font-size: 9px; color: var(--muted);
    width: 10px; display: inline-block; transition: transform 0.1s ease-in-out; }
  .comment.collapsed .comment-body { display: none; }
  .comment.collapsed .comment-header { border-bottom: 0; }
  .comment.collapsed .collapse-arrow { transform: rotate(-90deg); }
  .comment-index { color: var(--fg-strong); font-weight: 600; }
  .comment-author { color: var(--fg); background: var(--pre-bg);
    border: 1px solid var(--border); border-radius: 3px; padding: 0 6px; }
  .comment-ts { margin-left: auto; }
  /* Muted absolute-timestamp shown next to a relative "x ago" — hybrid so
     the reader gets scan speed AND cross-timestamp comparison without a
     hover per cell. Applied inside .comment-ts / .q-ts / .r-ts headers
     and inside .q-answer-label / review resolved-meta. */
  .ts-abs { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .comment-delete { background: transparent; border: 0; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 2px 6px; cursor: pointer;
    opacity: 0; transition: opacity 100ms ease, color 100ms ease;
    border-radius: 3px; }
  .comment-header:hover .comment-delete { opacity: 0.7; }
  .comment-delete:hover { opacity: 1; color: var(--danger, #d33); background: var(--pre-bg); }
  /* Copy-to-clipboard button used across comment / question / review cards.
     Same reveal-on-hover shape as .comment-delete: hidden by default,
     0.7 opacity when the parent card header is hovered, full opacity
     + blue on the button itself, kept visible + green during the 1s
     "copied" flash so the feedback is legible even after the pointer
     moves off. Any `*-header` ancestor triggers the reveal — that's
     how one class serves all three card types. */
  .card-copy { background: transparent; border: 0; color: var(--muted);
    font-size: 12px; line-height: 1; padding: 2px 6px; cursor: pointer;
    opacity: 0; transition: opacity 100ms ease, color 100ms ease;
    border-radius: 3px; font-family: inherit; }
  .comment-header:hover .card-copy,
  .q-header:hover .card-copy,
  .r-header:hover .card-copy { opacity: 0.7; }
  .card-copy:hover { opacity: 1; color: var(--link); background: var(--pre-bg); }
  .card-copy.copied { opacity: 1; color: var(--ok); }
  /* Answer-block copy sits outside a header — always faintly visible
     so the reader knows the answer is copyable. */
  .q-answer .card-copy { opacity: 0.5; }
  .q-answer .card-copy:hover { opacity: 1; }
  .comment-body { color: var(--fg-strong); padding: 10px 12px; }
  /* Demote heading scale *inside* a comment so an h2 in the body doesn't
     read like a section break in the modal itself. */
  .comment-body.md-body h1 { font-size: 15px; margin: 10px 0 4px; }
  .comment-body.md-body h2 { font-size: 14px; margin: 10px 0 4px; }
  .comment-body.md-body h3 { font-size: 13px; margin: 8px 0 4px; }
  .comment-body.md-body h4 { font-size: 12px; margin: 8px 0 4px;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

  /* Rendered markdown (comments, task body preview, changelog summary).
     `.md-body` is block-level; `.md-inline` (used for changelog summary,
     which sits inside a grid cell) contains inline formatting only and
     is emitted without wrapping <p>. */
  .md-body > *:first-child { margin-top: 0; }
  .md-body > *:last-child { margin-bottom: 0; }
  .md-body p { margin: 0 0 8px; line-height: 1.5; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
    color: var(--fg-strong); margin: 14px 0 6px; font-weight: 600; line-height: 1.3; }
  .md-body h1 { font-size: 18px; }
  .md-body h2 { font-size: 16px; }
  .md-body h3 { font-size: 14px; }
  .md-body h4 { font-size: 13px; }
  .md-body ul, .md-body ol { margin: 0 0 8px; padding-left: 22px; }
  .md-body li { margin: 2px 0; line-height: 1.5; }
  .md-body li > p { margin: 0; }
  .md-body code { background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; font-family: ui-monospace, SF Mono, Menlo, monospace;
    font-size: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .md-body pre { background: var(--pre-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 10px; margin: 0 0 8px;
    max-width: 100%; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .md-body pre code { background: transparent; border: 0; padding: 0; font-size: 12px; }
  .md-body blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border);
    color: var(--muted); }
  .md-body a { color: var(--link); }
  .md-body hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .md-body table { border-collapse: collapse; margin: 0 0 8px; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .md-body th { background: var(--code-bg); color: var(--fg-strong); }
  .md-inline code { background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; font-family: ui-monospace, SF Mono, Menlo, monospace;
    font-size: 12px; }
  .md-inline a { color: var(--link); }

  /* Task-body view/edit toggle. Body defaults to rendered view when
     opening an existing task; a small "Edit" button flips to textarea.
     Both the rendered view and the textarea are capped and scroll
     internally so long bodies don't push the modal past the viewport. */
  .body-view { background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 12px; min-height: 120px;
    max-height: 55vh; overflow-y: auto; color: var(--fg-strong); }
  .body-view.empty { color: var(--muted); font-style: italic; }
  .body-toggle { display: flex; align-items: center; gap: 8px; }
  .body-toggle .flex { flex: 1; }
  .comment-form { display: flex; gap: 6px; margin-top: 10px; }
  .comment-form input { flex: 1; background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font: inherit; }
  .comment-form button { background: var(--link); color: #0b0d10; border: 0;
    border-radius: 4px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 100; padding: 60px 16px 16px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    width: 100%; max-width: 960px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .modal-header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--fg-strong); }
  .modal-header .modal-id { color: var(--muted); font-family: ui-monospace, SF Mono, Menlo, monospace;
    font-size: 12px; margin-left: 10px; display: inline-flex; vertical-align: middle; }
  .modal-close { background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 4px; }
  .modal-close:hover { color: var(--fg-strong); }
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; }
  .modal-tab { background: transparent; border: 0; color: var(--muted); cursor: pointer;
    padding: 10px 14px; font: inherit; font-size: 13px; border-bottom: 2px solid transparent;
    margin-bottom: -1px; }
  .modal-tab:hover { color: var(--fg); }
  .modal-tab.active { color: var(--fg-strong); border-bottom-color: var(--link); }
  .modal-body { padding: 16px 18px 18px; }
  .modal-panel { display: none; }
  .modal-panel.active { display: block; }
  /* Comments and Questions panels: cap their list height so the modal
     stays a stable size regardless of how many entries a task has. The
     list scrolls internally; the "add" form stays pinned below the scroll
     area so posting is always in reach. */
  .modal-panel[data-panel="comments"].active,
  .modal-panel[data-panel="questions"].active,
  .modal-panel[data-panel="review"].active { display: flex; flex-direction: column; min-height: 0; }
  #modal-comments, #modal-questions, #modal-review-items { max-height: 55vh; overflow-y: auto;
    padding-right: 4px; scrollbar-width: thin; }
  #modal-comments::-webkit-scrollbar,
  #modal-questions::-webkit-scrollbar,
  #modal-review-items::-webkit-scrollbar { width: 6px; }
  #modal-comments::-webkit-scrollbar-thumb,
  #modal-questions::-webkit-scrollbar-thumb,
  #modal-review-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .field { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: start;
    margin-bottom: 10px; }
  .field.field-wide { grid-template-columns: 1fr; gap: 4px; }
  .field.field-wide label { padding-top: 0; }
  .field.field-wide > * { min-width: 0; }
  .field label { color: var(--muted); font-size: 12px; padding-top: 6px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .field input[type=text], .field select, .field textarea {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font: inherit; width: 100%; }
  .field textarea { min-height: 220px; resize: vertical; }
  /* Task modal details form: Title spans full width; below it, a 30/70
     split with metadata fields on the left and the Body textarea on the
     right. Footer stays full-width. */
  .modal-split { display: grid; grid-template-columns: 3fr 7fr; gap: 18px; align-items: start; }
  .modal-split > * { min-width: 0; }
  .modal-split .field-wide textarea { min-height: 340px; max-height: 55vh; }
  .modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .modal-footer .footer-right { display: flex; align-items: center; gap: 10px; }
  .save-flash { color: var(--ok); font-size: 12px; opacity: 0; transition: opacity 0.15s ease-in-out; }
  .save-flash.show { opacity: 1; }
  .save-flash.error { color: var(--danger); }
  .modal-footer .primary { background: var(--link); color: #0b0d10; border: 0;
    border-radius: 4px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .modal-footer .primary:hover { filter: brightness(1.1); }
  .modal-footer .danger { background: transparent; color: var(--danger); border: 1px solid #5a1e1e;
    border-radius: 4px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .modal-footer .danger:hover { background: #2a1414; }
  .modal-meta { color: var(--muted); font-size: 11px; font-family: ui-monospace, SF Mono, Menlo, monospace;
    margin-top: 8px; }
  .modal-meta .draft-restored { color: var(--link); font-weight: 600; }
  .modal-meta .linklike { background: none; border: 0; padding: 0; margin-left: 6px;
    color: var(--link); font: inherit; font-family: inherit; cursor: pointer; text-decoration: underline; }
  .modal-meta .linklike:hover { filter: brightness(1.15); }

  .kind { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    background: var(--code-bg); color: var(--muted); margin-right: 8px; }
  .kind.feature  { color: #9ecbff; }
  .kind.fix      { color: #ff9c9c; }
  .kind.refactor { color: #ffcf7a; }
  .kind.decision { color: #c8a2ff; }
  .kind.note     { color: var(--muted); }

  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px;
    background: var(--code-bg); color: var(--muted); margin-right: 4px; }
  .dep { font-family: ui-monospace, SF Mono, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .dep.blocked { color: var(--danger); }
  .dep.done { color: var(--ok); }

  .empty { color: var(--muted); font-style: italic; padding: 16px 0; }
  .error { color: var(--danger); padding: 8px 12px; border: 1px solid #5a1e1e; border-radius: 4px;
    background: #2a1414; margin: 8px 0; font-size: 12px; }

  .cl-day { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 14px 0 4px; padding-bottom: 3px;
    border-bottom: 1px solid var(--border); font-family: ui-monospace, SF Mono, Menlo, monospace; }
  .cl-day:first-child { margin-top: 0; }
  .cl-row { display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 200px) auto;
    gap: 12px; align-items: center; padding: 7px 8px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 13px; }
  .cl-row:last-child { border-bottom: none; }
  .cl-row:hover { background: var(--row-hover); }
  .cl-row .cl-summary { color: var(--fg-strong); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cl-row .cl-refs { color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cl-row .cl-ts { color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace; white-space: nowrap; }
  .cl-row .kind { margin-right: 0; }

  /* Questions section (modal tab). Unresolved questions render at the top
     as a bordered card each, mirroring the comment card shape but with a
     distinct accent (soft purple → "actionable state" vs. comments'
     neutral). Resolved questions render below in a dimmer, collapsed form. */
  .q-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .q-empty { color: var(--muted); font-style: italic; padding: 12px 0; }
  .q-card { background: var(--pre-bg); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; }
  .q-card.open { border-color: rgba(200,162,255,0.35); }
  .q-header { display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(200,162,255,0.08);
    border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    cursor: pointer; user-select: none; }
  .q-header:hover { filter: brightness(1.15); }
  .q-header .collapse-arrow { font-size: 9px; color: var(--muted);
    width: 10px; display: inline-block; transition: transform 0.1s ease-in-out; }
  .q-card.collapsed .q-body,
  .q-card.collapsed .q-answer,
  .q-card.collapsed .q-actions,
  .q-card.collapsed .q-answer-form { display: none; }
  .q-card.collapsed .q-header { border-bottom: 0; }
  .q-card.collapsed .collapse-arrow { transform: rotate(-90deg); }
  .q-card.resolved .q-header { background: var(--code-bg); }
  .q-header .q-id { color: var(--fg-strong); font-weight: 600; }
  .q-header .q-chip { color: var(--fg); background: var(--pre-bg);
    border: 1px solid var(--border); border-radius: 3px; padding: 0 6px; }
  .q-header .q-chip.asked-of { color: #c8a2ff; border-color: rgba(200,162,255,0.35); }
  .q-header .q-chip.asked-of.self { color: #ffcf7a; border-color: rgba(255,207,122,0.35); }
  .q-header .q-status { margin-left: auto; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 600; }
  .q-card.open .q-status { color: #c8a2ff; }
  .q-card.resolved .q-status { color: var(--ok); opacity: 0.7; }
  .q-body { padding: 10px 12px; color: var(--fg-strong); }
  .q-answer { padding: 10px 12px; border-top: 1px dashed var(--border);
    background: rgba(156,255,192,0.04); }
  .q-answer .q-answer-label { color: var(--muted); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    display: flex; align-items: center; gap: 8px; }
  .q-answer .q-answer-label .card-copy { margin-left: auto; text-transform: none;
    letter-spacing: 0; }
  .q-actions { display: flex; gap: 6px; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--code-bg); }
  .q-actions .spacer { flex: 1; }
  .q-actions .icon-btn { font-size: 11px; }
  .q-answer-form { display: none; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--code-bg); gap: 6px; flex-direction: column; }
  .q-answer-form.open { display: flex; }
  .q-answer-form textarea { background: var(--pre-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
    font: inherit; resize: vertical; min-height: 60px; }
  .q-answer-form .q-answer-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .q-form { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--pre-bg); margin-top: 10px; }
  .q-form textarea { background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
    font: inherit; resize: vertical; min-height: 44px; }
  .q-form-row { display: flex; gap: 6px; align-items: center; }
  .q-form-row select, .q-form-row input {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; }
  .q-form-row .spacer { flex: 1; }
  .q-form-row label { color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .q-form-row button { background: var(--link); color: #0b0d10; border: 0;
    border-radius: 4px; padding: 5px 12px; font: inherit; font-weight: 600;
    cursor: pointer; font-size: 12px; }
  .q-resolved-header { margin: 14px 0 6px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    padding-bottom: 3px; border-bottom: 1px solid var(--border); }

  /* Task-row question badges (main list): show "?N" when there are unresolved
     questions on a task. Uses the same soft-purple accent as the modal card
     header so the row and the drill-down feel visually connected. */
  .q-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 11px; font-weight: 600; background: rgba(200,162,255,0.10);
    color: #c8a2ff; border: 1px solid rgba(200,162,255,0.30);
    font-family: ui-monospace, SF Mono, Menlo, monospace; }
  .q-badge.awaits-user { background: rgba(255,207,122,0.10);
    color: #ffcf7a; border-color: rgba(255,207,122,0.30); }

  /* Review checklist (modal tab). Mirrors the questions card shape but with
     a soft-teal accent — a distinct "review agenda" affordance. Open items
     render first; resolved (checked or dismissed) render below in a dimmer
     collapsed form. */
  .r-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .r-empty { color: var(--muted); font-style: italic; padding: 12px 0; }
  .r-card { background: var(--pre-bg); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; }
  .r-card.open { border-color: rgba(122,220,214,0.35); }
  .r-header { display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(122,220,214,0.08);
    border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    cursor: pointer; user-select: none; }
  .r-header:hover { filter: brightness(1.15); }
  .r-header .collapse-arrow { font-size: 9px; color: var(--muted);
    width: 10px; display: inline-block; transition: transform 0.1s ease-in-out; }
  .r-card.collapsed .r-body,
  .r-card.collapsed .r-ref,
  .r-card.collapsed .r-actions,
  .r-card.collapsed .r-edit-form { display: none; }
  .r-card.collapsed .r-header { border-bottom: 0; }
  .r-card.collapsed .collapse-arrow { transform: rotate(-90deg); }
  .r-card.resolved .r-header { background: var(--code-bg); }
  .r-card.dismissed .r-header { background: var(--code-bg); }
  .r-header .r-id { color: var(--fg-strong); font-weight: 600; }
  .r-header .r-chip { color: var(--fg); background: var(--pre-bg);
    border: 1px solid var(--border); border-radius: 3px; padding: 0 6px; }
  .r-header .r-status { margin-left: auto; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 600; }
  .r-card.open .r-status { color: #7adcd6; }
  .r-card.resolved .r-status { color: var(--ok); opacity: 0.75; }
  .r-card.dismissed .r-status { color: var(--muted); opacity: 0.85; }
  .r-body { padding: 10px 12px; color: var(--fg-strong); }
  .r-ref { padding: 0 12px 10px; color: var(--muted); font-size: 11px;
    font-family: ui-monospace, SF Mono, Menlo, monospace; word-break: break-all; }
  .r-ref .r-ref-label { color: var(--muted); opacity: 0.7; text-transform: uppercase;
    letter-spacing: 0.04em; margin-right: 6px; font-size: 10px; }
  .r-actions { display: flex; gap: 6px; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--code-bg); }
  .r-actions .spacer { flex: 1; }
  .r-actions .icon-btn { font-size: 11px; }
  .r-actions .icon-btn.primary { color: #7adcd6; border-color: rgba(122,220,214,0.35); }
  .r-actions .icon-btn.primary:hover { background: rgba(122,220,214,0.10); }
  .r-edit-form { display: none; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--code-bg); gap: 6px; flex-direction: column; }
  .r-edit-form.open { display: flex; }
  .r-edit-form textarea { background: var(--pre-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
    font: inherit; resize: vertical; min-height: 60px; }
  .r-edit-form input[type=text] { background: var(--pre-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font: inherit; }
  .r-edit-form .r-edit-actions { display: flex; gap: 6px; justify-content: flex-end;
    align-items: center; }
  .r-form { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--pre-bg); margin-top: 10px; }
  .r-form textarea { background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
    font: inherit; resize: vertical; min-height: 44px; }
  .r-form-row { display: flex; gap: 6px; align-items: center; }
  .r-form-row input {
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; }
  .r-form-row input[name="ref"] { flex: 1; min-width: 0; }
  .r-form-row .spacer { flex: 1; }
  .r-form-row label { color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .r-form-row button { background: var(--link); color: #0b0d10; border: 0;
    border-radius: 4px; padding: 5px 12px; font: inherit; font-weight: 600;
    cursor: pointer; font-size: 12px; }
  .r-resolved-header { margin: 14px 0 6px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    padding-bottom: 3px; border-bottom: 1px solid var(--border); }

  /* Task-row review-progress badge (main list): "✓2/5" for tasks with a
     review checklist. Colour softens as the checklist nears complete;
     fully-resolved lists don't render (the row's review-check ✓ does that job). */
  .r-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 11px; font-weight: 600; background: rgba(122,220,214,0.10);
    color: #7adcd6; border: 1px solid rgba(122,220,214,0.30);
    font-family: ui-monospace, SF Mono, Menlo, monospace; }
  .r-badge.complete { background: rgba(156,255,192,0.10);
    color: var(--ok); border-color: rgba(156,255,192,0.30); opacity: 0.85; }

  /* Changelog detail modal — reuses .modal-* base styles */
  .cl-detail { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; }
  .cl-detail .label { color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; padding-top: 2px; }
  .cl-detail .value { color: var(--fg); }
  .cl-detail .value.mono { font-family: ui-monospace, SF Mono, Menlo, monospace; font-size: 12px; }
  .cl-detail .value .task-link { color: var(--link); cursor: pointer; text-decoration: none;
    font-family: ui-monospace, SF Mono, Menlo, monospace; }
  .cl-detail .value .task-link:hover { text-decoration: underline; }
  .cl-detail .value .summary-full { white-space: pre-wrap; color: var(--fg-strong); }

  /* Relations tab. Four sections (Parent / Subtasks / Depends on / Blocks),
     each a compact table of task-row-level details. Rows click through to
     the other task's modal. Missing ids (dangling refs) render as an
     "unknown" row so authors can spot the broken link. */
  .deps-section { margin-bottom: 18px; }
  .deps-section:last-child { margin-bottom: 0; }

// Help modal is mounted from a shared vendored module so pm/index.html
