<script type="module">
// Markdown rendering: `marked` for CommonMark + GFM, DOMPurify to strip any
// raw HTML the source contains. Comments and task bodies are user-authored
// strings written by both humans and Claude; treat them as untrusted even
// though the pm UI is local-only. The `inline: true` form parses without
// wrapping in <p> — used for changelog summaries where a paragraph tag
// would break the modal's grid layout.
import { marked } from "./vendor/marked.esm.js";
import createDOMPurify from "./vendor/purify.es.mjs";

// DOMPurify's ESM default is a factory in non-browser contexts and a
// ready instance in the browser; handle both so this doesn't break if
// upstream ever ships the factory-only build.
const purify = (typeof createDOMPurify.sanitize === "function")
  ? createDOMPurify
  : createDOMPurify(window);

marked.setOptions({ gfm: true, breaks: true });

window.renderMarkdown = function(src, opts = {}) {
  const s = src == null ? "" : String(src);
  const html = opts.inline ? marked.parseInline(s) : marked.parse(s);
  return purify.sanitize(html);
};
</script>
<script>
// Fallback for the tiny window before the ESM module block installs the
// real `renderMarkdown` — plain HTML-escape so nothing renders as raw
// HTML. The module overrides this synchronously on load; only stray
// synchronous calls during initial parse would ever hit the shim.
window.renderMarkdown = function(src) {
  const s = src == null ? "" : String(src);
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
};

const STATUSES = ["all", "ready", "open", "in_progress", "blocked", "on_hold", "done", "cancelled", "wont_do"];
const TASK_STATUS_OPTIONS = ["open", "in_progress", "blocked", "on_hold", "done", "cancelled", "wont_do"];
const PRIORITY_OPTIONS = ["P0", "P1", "P2", "P3"];
const PRIORITY_LABELS = {P0: "critical", P1: "high", P2: "normal", P3: "low"};
const REVIEW_OPTIONS = ["needs", "reviewed", "unreviewed"];
const REVIEW_LABELS = {needs: "needs review", reviewed: "reviewed", unreviewed: "unreviewed"};
const PINNED_OPTIONS = ["pinned", "unpinned"];
const PINNED_LABELS = {pinned: "pinned", unpinned: "unpinned"};
const PAGE_SIZE = 20;
let allTasks = [];
// Filter axes are tri-state. Each axis carries two disjoint sets: `inc`
// (values that must match — OR'd across the set) and `exc` (values that
// must NOT match — any hit disqualifies the task). Empty inc + empty exc =
// no filter on that axis. A given value is only ever in one set at a time;
// the click cycle is unapplied → include → exclude → unapplied. Values are
// chip keys (e.g. "open", "P1", "__ungrouped__", "__untagged__").
//
// NEVER reassign one of these tri objects — mutate in place. The click
// handlers wired in `wireTriFilter` close over the object identity; a
// reassignment (e.g. from `parseUrl`) would leave those closures pointing
// at an abandoned tri and clicks would silently update the wrong state
// (see T-0288). All state resets go through `clearTri` / `resetTriFromCsv`.
function newTri() { return {inc: new Set(), exc: new Set()}; }
let activeStatus = newTri();
let activePriority = newTri();
let activeGroup = newTri();
let activeTag = newTri();
let activeAge = newTri();
// Review filter is tri-state over three overlapping predicates. `reviewed`
// and `unreviewed` partition the task set; `needs` overlaps `unreviewed`
// (a flagged task with reviewed_at=null matches both). Same include/exclude
// cycle as the other tri axes — see the tri comment above.
let activeReview = newTri();
// Pinned filter is tri-state (pinned / unpinned partition the task set).
// Mutated in place — see the tri comment above.
let activePinned = newTri();
// Sidebar collapse persisted per-machine (filters are per-URL).
let sidebarCollapsed = false;

const AGE_BUCKETS = [
  {key: "today", label: "today (< 24h)", maxHours: 24},
  {key: "week",  label: "this week (< 7d)", maxHours: 24 * 7},
  {key: "month", label: "this month (< 30d)", maxHours: 24 * 30},
  {key: "older", label: "older (30d+)", maxHours: Infinity},
];

function ageBucketFor(ts) {
  if (!ts) return "older";
  const then = Date.parse(ts);
  if (isNaN(then)) return "older";
  const hours = (Date.now() - then) / 3600000;
  for (const b of AGE_BUCKETS) if (hours < b.maxHours) return b.key;
  return "older";
}

// Cycle a value through a tri-state axis: unapplied → include → exclude → unapplied.
function cycleTri(tri, value) {
  if (tri.inc.has(value)) { tri.inc.delete(value); tri.exc.add(value); }
  else if (tri.exc.has(value)) { tri.exc.delete(value); }
  else { tri.inc.add(value); }
}
function triActive(tri) { return tri.inc.size > 0 || tri.exc.size > 0; }
function triState(tri, value) {
  if (tri.inc.has(value)) return "include";
  if (tri.exc.has(value)) return "exclude";
  return "";
}
let searchQuery = "";
let tasksPage = 1;
let taskSort = {key: "updated_at", dir: "desc"};
let openTaskId = null;
let activeTab = "details";
let modalMode = "edit"; // "edit" | "create"
let draftRestored = false; // true when the current create modal was hydrated from a saved draft

// ── new-task draft persistence ──
// Accidental modal close (Escape, backdrop click) and full-page refresh both
// used to wipe an in-progress new-task form. Draft is snapshotted to
// localStorage on every input while the create modal is open, restored on
// next open, and cleared only on successful create or explicit Discard.
const NEWTASK_DRAFT_KEY = "pm.newtask.draft";

function saveNewTaskDraft() {
  if (modalMode !== "create") return;
  const f = document.getElementById("modal-edit-form");
  if (!f) return;
  const draft = {
    title: f.title.value,
    status: f.status.value,
    priority: f.priority.value,
    group: f.group.value,
    tags: f.tags.value,
    assignee: f.assignee.value,
    depends_on: f.depends_on.value,
    parent_task_id: f.parent_task_id.value,
    body: f.body.value,
  };
  // Don't persist an empty shell — nothing to recover.
  const meaningful = draft.title.trim() || draft.body.trim() ||
    draft.group.trim() || draft.tags.trim() || draft.depends_on.trim() ||
    draft.parent_task_id.trim();
  try {
    if (meaningful) localStorage.setItem(NEWTASK_DRAFT_KEY, JSON.stringify(draft));
    else localStorage.removeItem(NEWTASK_DRAFT_KEY);
  } catch {}
}

function loadNewTaskDraft() {
  try {
    const raw = localStorage.getItem(NEWTASK_DRAFT_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function clearNewTaskDraft() {
  try { localStorage.removeItem(NEWTASK_DRAFT_KEY); } catch {}
  draftRestored = false;
  renderDraftBanner();
}

function renderDraftBanner() {
  const meta = document.getElementById("modal-meta");
  if (!meta) return;
  if (modalMode === "create" && draftRestored) {
    meta.innerHTML = `<span class="draft-restored">Draft restored</span> ` +
      `<button type="button" id="modal-discard-draft" class="linklike">Discard</button>`;
    const btn = document.getElementById("modal-discard-draft");
    if (btn) btn.addEventListener("click", () => {
      const f = document.getElementById("modal-edit-form");
      if (f) {
        f.title.value = "";
        f.status.value = "open";
        f.priority.value = "P2";
        f.group.value = "";
        f.tags.value = "";
        f.assignee.value = "claude";
        f.depends_on.value = "";
        f.parent_task_id.value = "";
        f.body.value = "";
        setBodyMode("edit");
      }
      clearNewTaskDraft();
    });
  } else if (modalMode === "create") {
    meta.textContent = "";
  }
}

// ── api ──
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`GET ${path}: ${r.status}`);
  return r.json();
}
async function apiSend(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await r.text();
  const data = text ? JSON.parse(text) : {};
  if (!r.ok) throw new Error((data && data.error) || `${method} ${path}: ${r.status}`);
  return data;
}

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 5000);
}

// ── tasks ──
function isReady(task, byId) {
  if (task.status !== "open") return false;
  const deps = task.depends_on || [];
  return deps.every(id => byId[id] && byId[id].status === "done");
}

function knownGroups() {
  const s = new Set();
  for (const t of allTasks) if (t.group) s.add(t.group);
  return [...s].sort();
}

function knownTags() {
  const s = new Set();
  for (const t of allTasks) for (const tag of (t.tags || [])) s.add(tag);
  return [...s].sort();
}

// Predicates for each task filter axis. Kept separate so chip counts
// can hold one axis "open" while applying the others.
// Tri-state semantics: a task passes if none of the axis's `exc` values
// match AND (the axis's `inc` is empty OR at least one `inc` value matches).
// For multi-valued fields (tags), a single overlap with `exc` disqualifies
// even if another tag would satisfy `inc` — "exclude" is the strong signal.
function statusMatchesValue(t, v, byId) {
  return v === "ready" ? isReady(t, byId) : t.status === v;
}
function taskMatchesStatus(t, tri, byId) {
  for (const s of tri.exc) if (statusMatchesValue(t, s, byId)) return false;
  if (!tri.inc.size) return true;
  for (const s of tri.inc) if (statusMatchesValue(t, s, byId)) return true;
  return false;
}
function priorityValueOf(t) { return t.priority || "P2"; }
function taskMatchesPriority(t, tri) {
  const p = priorityValueOf(t);
  if (tri.exc.has(p)) return false;
  if (!tri.inc.size) return true;
  return tri.inc.has(p);
}
function groupMatchesValue(t, v) {
  if (v === "__ungrouped__") return !t.group;
  return t.group === v;
}
function taskMatchesGroup(t, tri) {
  for (const v of tri.exc) if (groupMatchesValue(t, v)) return false;
  if (!tri.inc.size) return true;
  for (const v of tri.inc) if (groupMatchesValue(t, v)) return true;
  return false;
}
function tagMatchesValue(t, v) {
  const tags = t.tags || [];
  if (v === "__untagged__") return !tags.length;
  return tags.includes(v);
}
function taskMatchesTag(t, tri) {
  for (const v of tri.exc) if (tagMatchesValue(t, v)) return false;
  if (!tri.inc.size) return true;
  for (const v of tri.inc) if (tagMatchesValue(t, v)) return true;
  return false;
}
function reviewMatchesValue(t, v) {
  if (v === "needs") return !!t.needs_review;
  if (v === "reviewed") return t.reviewed_at != null;
  if (v === "unreviewed") return t.reviewed_at == null;
  return false;
}
function taskMatchesReview(t, tri) {
  for (const v of tri.exc) if (reviewMatchesValue(t, v)) return false;
  if (!tri.inc.size) return true;
  for (const v of tri.inc) if (reviewMatchesValue(t, v)) return true;
  return false;
}
function pinnedMatchesValue(t, v) {
  if (v === "pinned") return !!t.pinned;
  if (v === "unpinned") return !t.pinned;
  return false;
}
function taskMatchesPinned(t, tri) {
  for (const v of tri.exc) if (pinnedMatchesValue(t, v)) return false;
  if (!tri.inc.size) return true;
  for (const v of tri.inc) if (pinnedMatchesValue(t, v)) return true;
  return false;
}
function taskMatchesAge(t, tri) {
  const b = ageBucketFor(t.created_at);
  if (tri.exc.has(b)) return false;
  if (!tri.inc.size) return true;
  return tri.inc.has(b);
}

function appendCount(chip, n) {
  const c = document.createElement("span");
  c.className = "chip-count";
  c.textContent = n;
  chip.appendChild(c);
  if (n === 0) chip.classList.add("zero");
}

// Render the whole filter sidebar: tri-state listboxes for each axis
// (Status/Priority/Review/Pinned/Age/Group/Tag), a match-count summary,
// and a "clear all" button.
// Option counts are per-value totals across allTasks (not cross-filtered
// against the other active axes). The footer match-count is the
// authoritative "what will I get" preview.
function renderSidebar() {
  const byId = Object.fromEntries(allTasks.map(t => [t.id, t]));

  // Status includes the "ready" pseudo-value.
  const statusValues = STATUSES.filter(s => s !== "all");
  populateTri("f-status", statusValues, activeStatus, {
    label: v => v.replace("_", " "),
    count: v => allTasks.filter(t => statusMatchesValue(t, v, byId)).length,
  });

  populateTri("f-priority", PRIORITY_OPTIONS, activePriority, {
    label: v => `${v} · ${PRIORITY_LABELS[v]}`,
    count: v => allTasks.filter(t => priorityValueOf(t) === v).length,
  });

  populateTri("f-review", REVIEW_OPTIONS, activeReview, {
    label: v => REVIEW_LABELS[v] || v,
    count: v => allTasks.filter(t => reviewMatchesValue(t, v)).length,
  });

  populateTri("f-age", AGE_BUCKETS.map(b => b.key), activeAge, {
    label: v => (AGE_BUCKETS.find(b => b.key === v) || {label: v}).label,
    count: v => allTasks.filter(t => ageBucketFor(t.created_at) === v).length,
  });

  const groups = knownGroups();
  const groupValues = [...groups];
  if (groups.length) groupValues.push("__ungrouped__");
  populateTri("f-group", groupValues, activeGroup, {
    label: v => v === "__ungrouped__" ? "(ungrouped)" : v,
    count: v => allTasks.filter(t => groupMatchesValue(t, v)).length,
  });

  const tags = knownTags();
  const tagValues = [...tags];
  if (tags.length) tagValues.push("__untagged__");
  populateTri("f-tag", tagValues, activeTag, {
    label: v => v === "__untagged__" ? "(untagged)" : v,
    count: v => allTasks.filter(t => tagMatchesValue(t, v)).length,
  });

  populateTri("f-pinned", PINNED_OPTIONS, activePinned, {
    label: v => PINNED_LABELS[v] || v,
    count: v => allTasks.filter(t => pinnedMatchesValue(t, v)).length,
  });

  updateSidebarFooter();
  updateNeedsReviewChip();
  updatePinnedChip();
}

// Header "needs review" chip: reflects total count of flagged tasks (global,
// not filtered) and mirrors whether the Review=needs filter is engaged.
function updateNeedsReviewChip() {
  const el = document.getElementById("btn-needs-review");
  if (!el) return;
  const n = allTasks.reduce((acc, t) => acc + (t.needs_review ? 1 : 0), 0);
  el.querySelector("#needs-review-count").textContent = String(n);
  el.classList.toggle("zero", n === 0);
  el.classList.toggle("active", activeReview.inc.has("needs"));
}

// Header "pinned" chip: same shape as the needs-review chip but for the
// pinned shortlist. Count is global; active reflects Pinned=pinned filter.
function updatePinnedChip() {
  const el = document.getElementById("btn-pinned");
  if (!el) return;
  const n = allTasks.reduce((acc, t) => acc + (t.pinned ? 1 : 0), 0);
  el.querySelector("#pinned-count").textContent = String(n);
  el.classList.toggle("zero", n === 0);
  el.classList.toggle("active", activePinned.inc.has("pinned"));
}

// (Re)populate a tri-state listbox from the backing {inc, exc} tri.
// Each row renders as a click target that cycles through the three states
// via `cycleTri` — wiring is set up once in `wireTriFilter`.
function populateTri(elId, values, tri, {label, count}) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  for (const v of values) {
    const state = triState(tri, v);
    const row = document.createElement("div");
    row.className = "tri-row" + (state ? ` ${state}` : "");
    row.dataset.value = v;
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", state === "include" ? "true" : "false");
    if (state === "exclude") row.setAttribute("aria-label", `${label(v)} (excluded)`);
    const mark = document.createElement("span");
    mark.className = "tri-mark";
    const lab = document.createElement("span");
    lab.className = "tri-label";
    lab.textContent = label(v);
    const cnt = document.createElement("span");
    cnt.className = "tri-count";
    cnt.textContent = count(v);
    row.append(mark, lab, cnt);
    el.appendChild(row);
  }
}

// Sidebar footer: N-of-M matched count + Clear button state.
function updateSidebarFooter() {
  const byId = Object.fromEntries(allTasks.map(t => [t.id, t]));
  const needle = searchQuery.trim().toLowerCase();
  const matched = allTasks.filter(t =>
    taskMatchesStatus(t, activeStatus, byId) &&
    taskMatchesPriority(t, activePriority) &&
    taskMatchesGroup(t, activeGroup) &&
    taskMatchesTag(t, activeTag) &&
    taskMatchesReview(t, activeReview) &&
    taskMatchesPinned(t, activePinned) &&
    taskMatchesAge(t, activeAge) &&
    (!needle || taskMatchesSearch(t, needle))
  );
  document.getElementById("sidebar-match-count").textContent =
    `${matched.length} of ${allTasks.length} tasks`;
  const anyActive = triActive(activeStatus) || triActive(activePriority) ||
    triActive(activeGroup) || triActive(activeTag) || triActive(activeAge) ||
    triActive(activeReview) || triActive(activePinned) || searchQuery.trim();
  const btn = document.getElementById("sidebar-clear");
  btn.disabled = !anyActive;
  btn.classList.toggle("active-clear", !!anyActive);
}

function applySidebarCollapsed() {
  const layout = document.getElementById("tasks-layout");
  const btn = document.getElementById("sidebar-toggle");
  layout.classList.toggle("collapsed", sidebarCollapsed);
  btn.textContent = sidebarCollapsed ? "›" : "‹";
  btn.title = sidebarCollapsed ? "Expand filters" : "Collapse filters";
}

function taskSortValue(t, key) {
  switch (key) {
    case "id": return t.id || "";
    case "priority": return t.priority || "P2";
    case "status": return t.status || "";
    case "title": return (t.title || "").toLowerCase();
    case "group": return (t.group || "").toLowerCase();
    case "comments": return (t.comments || []).length;
    case "questions": return openQuestionCount(t);
    case "review_items": return openReviewItemCount(t);
    case "deps": return (t.depends_on || []).length;
    case "subtasks": return subtaskCountFor(t.id);
    case "assignee": return (t.assignee || "").toLowerCase();
    case "updated_at": return t.updated_at || "";
    // Review states: needs_review (2) > reviewed (1) > nothing (0). Sort desc → inbox first.
    case "review": return t.needs_review ? 2 : (t.reviewed_at != null ? 1 : 0);
    case "pinned": return t.pinned ? 1 : 0;
    default: return "";
  }
}

// Subtask counts are computed on-demand from the current allTasks snapshot
// so sort comparators can call this without a per-render precompute.
// Sort involves O(N log N) comparisons; each is O(1) via the cache.
let _subtaskCountCache = null;
let _subtaskCountCacheStamp = null;
function subtaskCountFor(id) {
  if (_subtaskCountCacheStamp !== allTasks) {
    _subtaskCountCache = {};
    for (const t of allTasks) {
      const p = t.parent_task_id;
      if (p) _subtaskCountCache[p] = (_subtaskCountCache[p] || 0) + 1;
    }
    _subtaskCountCacheStamp = allTasks;
  }
  return _subtaskCountCache[id] || 0;
}

function compareTasks(a, b, key, dir) {
  const av = taskSortValue(a, key);
  const bv = taskSortValue(b, key);
  let cmp;
  if (typeof av === "number" && typeof bv === "number") {
    cmp = av - bv;
  } else if (key === "id") {
    cmp = String(av).localeCompare(String(bv), undefined, {numeric: true});
  } else {
    cmp = String(av).localeCompare(String(bv));
  }
  if (cmp === 0) cmp = String(a.id).localeCompare(String(b.id), undefined, {numeric: true});
  return dir === "desc" ? -cmp : cmp;
}

function taskMatchesSearch(t, needle) {
  if (!needle) return true;
  const parts = [
    t.id, t.title, t.body, t.group, t.assignee,
    ...(t.tags || []),
    ...((t.comments || []).map(c => c.body)),
    ...((t.comments || []).map(c => c.author)),
    ...((t.questions || []).map(q => q.question)),
    ...((t.questions || []).map(q => q.answer)),
    ...((t.review_items || []).map(it => it.body)),
    ...((t.review_items || []).map(it => it.ref)),
  ];
  const hay = parts.filter(Boolean).join(" ").toLowerCase();
  return hay.includes(needle);
}

// Question-count helpers. Kept here (not on the task object) so they stay in
// sync with a single definition — the row badge, sort comparator, tab badge,
// and modal count all agree on "open" == unresolved.
function openQuestionCount(t) {
  let n = 0;
  for (const q of t.questions || []) if (!q.resolved) n++;
  return n;
}
function anyOpenQuestionAskedOfUser(t) {
  for (const q of t.questions || []) {
    if (!q.resolved && q.asked_of === "user") return true;
  }
  return false;
}

// Review-item helpers. Same shape as the question helpers so sort/badge/tab
// counts stay consistent across the UI.
function openReviewItemCount(t) {
  let n = 0;
  for (const it of t.review_items || []) if ((it.status || "open") === "open") n++;
  return n;
}
function totalReviewItemCount(t) {
  return (t.review_items || []).length;
}

function renderPager(pagerId, total, page, onChange) {
  const el = document.getElementById(pagerId);
  el.innerHTML = "";
  if (total <= PAGE_SIZE) return; // no pager needed
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const clamped = Math.min(Math.max(1, page), pages);
  const start = (clamped - 1) * PAGE_SIZE + 1;
  const end = Math.min(clamped * PAGE_SIZE, total);
  const prev = document.createElement("button");
  prev.type = "button"; prev.textContent = "‹ prev";
  prev.disabled = clamped <= 1;
  prev.onclick = () => onChange(clamped - 1);
  const next = document.createElement("button");
  next.type = "button"; next.textContent = "next ›";
  next.disabled = clamped >= pages;
  next.onclick = () => onChange(clamped + 1);
  const count = document.createElement("span");
  count.className = "pager-count";
  count.textContent = `${start}–${end} of ${total} · page ${clamped}/${pages}`;
  el.append(count, prev, next);
}

function renderTasks() {
  const container = document.getElementById("tasks");
  const countEl = document.getElementById("search-count");
  const byId = Object.fromEntries(allTasks.map(t => [t.id, t]));
  let rows = allTasks.filter(t =>
    taskMatchesStatus(t, activeStatus, byId) &&
    taskMatchesPriority(t, activePriority) &&
    taskMatchesGroup(t, activeGroup) &&
    taskMatchesTag(t, activeTag) &&
    taskMatchesReview(t, activeReview) &&
    taskMatchesPinned(t, activePinned) &&
    taskMatchesAge(t, activeAge));
  const needle = searchQuery.trim().toLowerCase();
  if (needle) rows = rows.filter(t => taskMatchesSearch(t, needle));

  countEl.textContent = `${rows.length} of ${allTasks.length}`;

  rows = rows.slice().sort((a, b) => compareTasks(a, b, taskSort.key, taskSort.dir));

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (tasksPage > pages) tasksPage = pages;
  const start = (tasksPage - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);

  if (!total) {
    container.innerHTML = '<div class="empty">No tasks match.</div>';
    renderPager("tasks-pager", 0, 1, () => {});
    return;
  }

  const cols = [
    {key: "review", label: "", cls: "review", title: "Review state · click to sort inbox-first"},
    {key: "pinned", label: "", cls: "pin-cell", title: "Pinned · click to sort pinned-first"},
    {key: "id", label: "ID"},
    {key: "priority", label: "Pri"},
    {key: "status", label: "Status"},
    {key: "title", label: "Title"},
    {key: "group", label: "Group"},
    {key: null, label: "Tags"},
    {key: "deps", label: "Deps", title: "Depends-on count · details in modal"},
    {key: "subtasks", label: "Subs", title: "Subtask count · details in modal"},
    {key: "comments", label: "💬"},
    {key: "questions", label: "?", title: "Open questions · unresolved count"},
    {key: "review_items", label: "✓", title: "Review checklist · open/total"},
    {key: "assignee", label: "Assignee"},
    {key: "updated_at", label: "Updated"},
  ];
  const headHtml = cols.map(c => {
    const cls = c.cls ? ` ${c.cls}` : "";
    const titleAttr = c.title ? ` title="${escapeHtml(c.title)}"` : "";
    if (!c.key) return `<th class="${cls.trim()}"${titleAttr}>${c.label}</th>`;
    const active = taskSort.key === c.key;
    const arrow = active ? `<span class="sort-arrow">${taskSort.dir === "asc" ? "▲" : "▼"}</span>` : "";
    return `<th class="sortable${cls}" data-sort-key="${c.key}"${titleAttr}>${c.label}${arrow}</th>`;
  }).join("");
  const table = document.createElement("table");
  table.innerHTML = `<thead><tr>${headHtml}</tr></thead>`;
  const tbody = document.createElement("tbody");

  for (const t of pageRows) {
    const tr = document.createElement("tr");
    tr.className = "clickable";
    tr.dataset.id = t.id;
    const depsCount = (t.depends_on || []).length;
    const deps = depsCount ? `<span class="dep">${depsCount}</span>` : "<span class='dep'>—</span>";
    const subsCount = subtaskCountFor(t.id);
    const subs = subsCount ? `<span class="dep">${subsCount}</span>` : "<span class='dep'>—</span>";
    const tags = (t.tags || []).map(x => `<span class="tag">${escapeHtml(x)}</span>`).join("") || "—";
    const priority = t.priority || "P2";
    const statusOptions = TASK_STATUS_OPTIONS.map(s =>
      `<option value="${s}" ${s === t.status ? "selected" : ""}>${s.replace("_", " ")}</option>`
    ).join("");
    const priorityOptions = PRIORITY_OPTIONS.map(p =>
      `<option value="${p}" ${p === priority ? "selected" : ""}>${p}</option>`
    ).join("");
    const commentCount = (t.comments || []).length;
    const titleHtml = escapeHtml(t.title || "");
    const commentsHtml = commentCount
      ? `<span class="dep">${commentCount}</span>`
      : "<span class='dep'>—</span>";
    const openQ = openQuestionCount(t);
    const questionsHtml = openQ
      ? `<span class="q-badge ${anyOpenQuestionAskedOfUser(t) ? "awaits-user" : ""}" title="${openQ} unresolved question${openQ === 1 ? "" : "s"}">?${openQ}</span>`
      : "<span class='dep'>—</span>";
    const totalR = totalReviewItemCount(t);
    const openR = openReviewItemCount(t);
    const reviewItemsHtml = totalR
      ? `<span class="r-badge ${openR === 0 ? "complete" : ""}" title="${openR} of ${totalR} review item${totalR === 1 ? "" : "s"} still open">✓${totalR - openR}/${totalR}</span>`
      : "<span class='dep'>—</span>";
    const groupHtml = t.group
      ? `<span class="group-pill">${escapeHtml(t.group)}</span>`
      : "<span class='dep'>—</span>";
    const reviewHtml = renderReviewCell(t);
    const isPinned = !!t.pinned;
    if (isPinned) tr.classList.add("pinned-row");
    const pinStar = isPinned ? "★" : "☆";
    const pinTitle = isPinned ? "Unpin" : "Pin for later";

    tr.innerHTML = `
      <td class="review">${reviewHtml}</td>
      <td class="pin-cell"><button type="button" class="pin-btn ${isPinned ? "pinned" : ""}" data-id="${t.id}" data-pinned="${isPinned ? "1" : "0"}" title="${pinTitle}" aria-label="${pinTitle}">${pinStar}</button></td>
      <td class="id">${copyIdHtml(t.id)}</td>
      <td><select class="priority-select ${priority}" data-id="${t.id}" data-field="priority">${priorityOptions}</select></td>
      <td><select class="status-select ${t.status}" data-id="${t.id}" data-field="status">${statusOptions}</select></td>
      <td class="title">${titleHtml}</td>
      <td>${groupHtml}</td>
      <td>${tags}</td>
      <td>${deps}</td>
      <td>${subs}</td>
      <td>${commentsHtml}</td>
      <td>${questionsHtml}</td>
      <td>${reviewItemsHtml}</td>
      <td>${t.assignee ? escapeHtml(t.assignee) : "<span class='dep'>—</span>"}</td>
      <td class="dep" title="${escapeHtml(formatAbs(t.updated_at))}">${escapeHtml(formatRelTime(t.updated_at))}</td>
    `;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.innerHTML = "";
  container.appendChild(table);

  // Wire sortable headers.
  container.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sortKey;
      if (taskSort.key === key) {
        taskSort.dir = taskSort.dir === "asc" ? "desc" : "asc";
      } else {
        // Numeric / recency-style keys default desc (highest first); text keys default asc.
        const descFirst = new Set(["updated_at", "review", "pinned", "comments", "questions", "review_items", "deps", "subtasks"]);
        taskSort = {key, dir: descFirst.has(key) ? "desc" : "asc"};
      }
      tasksPage = 1;
      renderTasks();
    });
  });

  // Wire inline dropdowns (stop click propagation so they don't open the modal).
  container.querySelectorAll("select.status-select, select.priority-select").forEach(sel => {
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = e.target.dataset.id;
      const field = e.target.dataset.field;
      try {
        await apiSend("PATCH", `/api/tasks/${id}`, {[field]: e.target.value});
        await refresh();
      } catch (err) {
        showError(err.message);
        await refresh();
      }
    });
  });

  // Row-level pin toggle. Stop propagation so it doesn't open the modal.
  container.querySelectorAll("button.pin-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const nextPinned = btn.dataset.pinned !== "1";
      try {
        await apiSend("PATCH", `/api/tasks/${id}`, {pinned: nextPinned});
        await refresh();
      } catch (err) {
        showError(err.message);
        await refresh();
      }
    });
  });

  // Row click → open modal. Skip when the click originated on a copy-id
  // chip — that handler is delegated on the container, so it fires *after*
  // this per-row listener and its stopPropagation can't rescue us.
  container.querySelectorAll("tr.clickable").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest(".copy-id")) return;
      openTaskModal(tr.dataset.id);
    });
  });

  wireCopyIds(container);

  renderPager("tasks-pager", total, tasksPage, (p) => {
    tasksPage = p;
    renderTasks();
    document.getElementById("tasks").scrollIntoView({block: "start", behavior: "instant"});
  });

  syncUrl();
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function copyIdHtml(id) {
  const safe = escapeHtml(id);
  return `<span class="copy-id" role="button" tabindex="0" data-copy="${safe}" `
    + `title="Copy ${safe}" aria-label="Copy ${safe}"><span class="copy-id-text">${safe}</span></span>`;
}

async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  // Fallback for http:// (localhost dev): temporary textarea + execCommand.
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.top = "-1000px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  document.body.removeChild(ta);
  return ok;
}

// Delegated wiring for .copy-id elements. Safe to call multiple times on the
// same container — we mark the container so we only bind once.
function wireCopyIds(container) {
  if (!container || container.dataset.copyIdsBound === "1") return;
  container.dataset.copyIdsBound = "1";
  const handle = async (el) => {
    const text = el.dataset.copy;
    if (!text) return;
    const ok = await copyToClipboard(text);
    if (!ok) return;
    const label = el.querySelector(".copy-id-text");
    const original = label ? label.textContent : null;
    el.classList.add("copied");
    if (label) label.textContent = "Copied";
    clearTimeout(el._copyTimer);
    el._copyTimer = setTimeout(() => {
      el.classList.remove("copied");
      if (label && original != null) label.textContent = original;
    }, 1200);
  };
  container.addEventListener("click", (e) => {
    const el = e.target.closest(".copy-id");
    if (!el || !container.contains(el)) return;
    e.stopPropagation();
    e.preventDefault();
    handle(el);
  });
  container.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const el = e.target.closest(".copy-id");
    if (!el || !container.contains(el)) return;
    e.stopPropagation();
    e.preventDefault();
    handle(el);
  });
}

function renderReviewCell(t) {
  if (t.needs_review) {
    return `<span class="review-dot" title="Needs review"></span>`;
  }
  if (t.reviewed_at != null) {
    const abs = formatAbs(t.reviewed_at);
    const rel = formatRelTime(t.reviewed_at);
    return `<span class="review-check" title="Reviewed ${escapeHtml(rel)} (${escapeHtml(abs)})">✓</span>`;
  }
  return `<span class="review-none">·</span>`;
}

function formatAbs(ts) {
  return (ts || "").replace("T", " ").replace("Z", "");
}

function formatAbsShort(ts) {
  // "2026-08-29T01:04:22Z" → "2026-08-29 01:04". Drops seconds + `Z` for
  // header-slot readability; use formatAbs when full precision matters.
  const s = formatAbs(ts);
  if (!s) return "";
  return s.length >= 16 ? s.slice(0, 16) : s;
}

function formatRelTime(ts) {
  if (!ts) return "";
  const then = Date.parse(ts);
  if (isNaN(then)) return "";
  let secs = Math.round((Date.now() - then) / 1000);
  const future = secs < 0;
  secs = Math.abs(secs);
  let out;
  if (secs < 5) out = "just now";
  else if (secs < 60) out = `${secs}s`;
  else if (secs < 3600) out = `${Math.floor(secs / 60)}m`;
  else if (secs < 86400) out = `${Math.floor(secs / 3600)}h`;
  else if (secs < 2592000) out = `${Math.floor(secs / 86400)}d`;
  else if (secs < 31536000) out = `${Math.floor(secs / 2592000)}mo`;
  else out = `${Math.floor(secs / 31536000)}y`;
  if (out === "just now") return out;
  return future ? `in ${out}` : `${out} ago`;
}

// ── modal ──
function currentTask() {
  return allTasks.find(t => t.id === openTaskId);
}

// Task body view/edit toggle. Modal always mounts an edit form, but for
// existing tasks we default to a rendered-markdown view so the body reads
// cleanly. The "Edit" button flips to the textarea; "Preview" flips back
// (re-rendering from the textarea's current contents so users see their
// in-progress markdown).
function setBodyMode(mode) {
  const view = document.getElementById("modal-body-view");
  const ta = document.querySelector('#modal-edit-form [name="body"]');
  const btn = document.getElementById("modal-body-edit");
  if (mode === "edit") {
    view.style.display = "none";
    ta.style.display = "";
    btn.textContent = "Preview";
    setTimeout(() => ta.focus(), 0);
  } else {
    const src = ta.value || "";
    if (src.trim()) {
      view.classList.remove("empty");
      view.innerHTML = window.renderMarkdown(src);
    } else {
      view.classList.add("empty");
      view.textContent = "No body.";
    }
    view.style.display = "";
    ta.style.display = "none";
    btn.textContent = "Edit";
  }
}

function populateStatusSelect() {
  const statusSel = document.querySelector('#modal-edit-form [name="status"]');
  statusSel.innerHTML = TASK_STATUS_OPTIONS.map(s =>
    `<option value="${s}">${s.replace("_", " ")}</option>`
  ).join("");
}

function openTaskModal(id) {
  modalMode = "edit";
  openTaskId = id;
  activeTab = "details";
  const t = currentTask();
  if (!t) {
    // Stale ?task= param pointing at an unknown id — drop it.
    openTaskId = null;
    syncUrl();
    return;
  }

  document.getElementById("modal-title").textContent = t.title || "(untitled)";
  const modalIdEl = document.getElementById("modal-id");
  modalIdEl.innerHTML = copyIdHtml(t.id);
  wireCopyIds(modalIdEl);

  populateStatusSelect();

  const f = document.getElementById("modal-edit-form");
  f.title.value = t.title || "";
  f.status.value = t.status || "open";
  f.priority.value = t.priority || "P2";
  f.group.value = t.group || "";
  f.tags.value = (t.tags || []).join(", ");
  f.assignee.value = t.assignee || "";
  f.depends_on.value = (t.depends_on || []).join(", ");
  f.parent_task_id.value = t.parent_task_id || "";
  f.body.value = t.body || "";

  document.getElementById("modal-meta").innerHTML =
    `created <span title="${escapeHtml(formatAbs(t.created_at))}">${escapeHtml(formatRelTime(t.created_at))}</span>` +
    ` · updated <span title="${escapeHtml(formatAbs(t.updated_at))}">${escapeHtml(formatRelTime(t.updated_at))}</span>`;

  // Edit mode: show Delete, show Comments + Questions + Review tabs, submit label = Save.
  document.getElementById("modal-delete").style.display = "";
  document.querySelector('.modal-tab[data-tab="comments"]').style.display = "";
  document.querySelector('.modal-tab[data-tab="questions"]').style.display = "";
  document.querySelector('.modal-tab[data-tab="review"]').style.display = "";
  document.querySelector('#modal-edit-form button[type="submit"]').textContent = "Save";
  updateReviewButton(t);
  setBodyMode("view");

  updateRelationsTabVisibility();
  renderModalTabs();
  renderComments();
  renderQuestions();
  renderReviewItems();
  renderRelations();
  document.getElementById("task-modal").classList.add("open");
  document.getElementById("task-modal").setAttribute("aria-hidden", "false");
  syncUrl();
}

function openTaskCreateModal() {
  modalMode = "create";
  openTaskId = null;
  activeTab = "details";

  document.getElementById("modal-title").textContent = "New task";
  document.getElementById("modal-id").textContent = "";

  populateStatusSelect();

  const f = document.getElementById("modal-edit-form");
  const draft = loadNewTaskDraft();
  draftRestored = !!draft;
  f.title.value = draft?.title ?? "";
  f.status.value = draft?.status ?? "open";
  f.priority.value = draft?.priority ?? "P2";
  f.group.value = draft?.group ?? "";
  f.tags.value = draft?.tags ?? "";
  f.assignee.value = draft?.assignee ?? "claude";
  f.depends_on.value = draft?.depends_on ?? "";
  f.parent_task_id.value = draft?.parent_task_id ?? "";
  f.body.value = draft?.body ?? "";

  renderDraftBanner();

  // Create mode: hide Delete, hide Comments/Questions/Relations tabs (nothing
  // to attach to a task that doesn't exist yet), submit label = Create.
  document.getElementById("modal-delete").style.display = "none";
  document.querySelector('.modal-tab[data-tab="comments"]').style.display = "none";
  document.querySelector('.modal-tab[data-tab="questions"]').style.display = "none";
  document.querySelector('.modal-tab[data-tab="review"]').style.display = "none";
  document.querySelector('.modal-tab[data-tab="relations"]').style.display = "none";
  document.querySelector('#modal-edit-form button[type="submit"]').textContent = "Create";
  document.getElementById("modal-mark-reviewed").style.display = "none";
  setBodyMode("edit");

  renderModalTabs();
  document.getElementById("task-modal").classList.add("open");
  document.getElementById("task-modal").setAttribute("aria-hidden", "false");
  syncUrl();
  setTimeout(() => f.title.focus(), 0);
}

function closeTaskModal() {
  openTaskId = null;
  modalMode = "edit";
  draftRestored = false;
  document.getElementById("task-modal").classList.remove("open");
  document.getElementById("task-modal").setAttribute("aria-hidden", "true");
  syncUrl();
}

function renderModalTabs() {
  document.querySelectorAll(".modal-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === activeTab);
  });
  document.querySelectorAll(".modal-panel").forEach(p => {
    p.classList.toggle("active", p.dataset.panel === activeTab);
  });
  const t = currentTask();
  const commentCount = t ? (t.comments || []).length : 0;
  document.getElementById("modal-comments-count").textContent = commentCount ? `(${commentCount})` : "";
  // Questions tab badge: unresolved count, or total if none open. Chosen so
  // an all-resolved task still shows a count (some history to browse) but
  // the open count is the primary signal.
  if (t) {
    const openQ = openQuestionCount(t);
    const totalQ = (t.questions || []).length;
    const qEl = document.getElementById("modal-questions-count");
    if (openQ > 0) qEl.textContent = `(${openQ})`;
    else if (totalQ > 0) qEl.textContent = `(${totalQ})`;
    else qEl.textContent = "";
    // Review tab: "open/total" so the reviewer sees progress at a glance.
    const openR = openReviewItemCount(t);
    const totalR = totalReviewItemCount(t);
    const rEl = document.getElementById("modal-review-count");
    if (totalR > 0) rEl.textContent = `(${totalR - openR}/${totalR})`;
    else rEl.textContent = "";
  } else {
    document.getElementById("modal-questions-count").textContent = "";
    document.getElementById("modal-review-count").textContent = "";
  }
  // Relations tab badge: forward deps + subtask count (relations rooted at this task).
  // Tab visibility is handled by updateRelationsTabVisibility.
  const depsCount = t ? (t.depends_on || []).length : 0;
  const subtaskCount = t ? allTasks.filter(x => x.parent_task_id === t.id).length : 0;
  const badge = depsCount + subtaskCount;
  document.getElementById("modal-deps-count").textContent = badge ? `(${badge})` : "";
}

// Relations tab. Renders sections:
//   Parent     — this task's parent (from t.parent_task_id), if any
//   Subtasks   — tasks whose parent_task_id is this one
//   Depends on — this task's forward deps (from t.depends_on)
//   Blocks     — tasks whose depends_on references this one
// Parent/Subtasks are scope containment (a tracking wrapper and its work items);
// Depends on/Blocks are ordering (one must finish before another can start).
// Each row mirrors the main task list's essentials (id · pri · status ·
// title · group · updated). Clicking a row swaps the modal to that task,
// so users can walk the relation graph without closing.
function renderRelations() {
  const t = currentTask();
  const container = document.getElementById("modal-dependencies");
  if (!t) { container.innerHTML = ""; return; }
  const byId = Object.fromEntries(allTasks.map(x => [x.id, x]));
  const forwardIds = t.depends_on || [];
  const forward = forwardIds.map(id => ({id, task: byId[id] || null}));
  const reverse = allTasks
    .filter(x => (x.depends_on || []).includes(t.id))
    .map(x => ({id: x.id, task: x}));
  const parentId = t.parent_task_id || null;
  const parent = parentId ? [{id: parentId, task: byId[parentId] || null}] : [];
  const subtasks = allTasks
    .filter(x => x.parent_task_id === t.id)
    .map(x => ({id: x.id, task: x}));

  const sections = [
    {title: "Parent",     rows: parent,   empty: "No parent (top-level task)."},
    {title: "Subtasks",   rows: subtasks, empty: "No subtasks."},
    {title: "Depends on", rows: forward,  empty: "No forward dependencies."},
    {title: "Blocks",     rows: reverse,  empty: "No tasks depend on this one."},
  ];
  container.innerHTML = sections.map(s => renderDepSection(s)).join("");

  container.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest(".copy-id")) return;
      openTaskModal(tr.dataset.id);
    });
  });

  wireCopyIds(container);
}

function renderDepSection({title, rows, empty}) {
  const head = `<h4>${escapeHtml(title)} <span class="count">${rows.length}</span></h4>`;
  if (!rows.length) {
    return `<div class="deps-section">${head}<div class="empty">${escapeHtml(empty)}</div></div>`;
  }
  const body = rows.map(({id, task}) => {
    if (!task) {
      return `<tr class="unknown"><td class="id">${copyIdHtml(id)}</td>` +
             `<td colspan="5">unknown — task not found</td></tr>`;
    }
    const pri = task.priority || "P2";
    const status = task.status || "open";
    const groupHtml = task.group
      ? `<span class="group-pill">${escapeHtml(task.group)}</span>`
      : `<span class="dep">—</span>`;
    const updatedAbs = formatAbs(task.updated_at);
    const updatedRel = formatRelTime(task.updated_at);
    return `<tr data-id="${escapeHtml(task.id)}">` +
      `<td class="id">${copyIdHtml(task.id)}</td>` +
      `<td><span class="priority-pill ${pri}">${pri}</span></td>` +
      `<td><span class="status-pill ${status}">${status.replace("_", " ")}</span></td>` +
      `<td class="title">${escapeHtml(task.title || "")}</td>` +
      `<td>${groupHtml}</td>` +
      `<td class="dep" title="${escapeHtml(updatedAbs)}">${escapeHtml(updatedRel)}</td>` +
    `</tr>`;
  }).join("");
  return `<div class="deps-section">${head}` +
    `<table class="deps-table"><thead><tr>` +
    `<th>ID</th><th>Pri</th><th>Status</th><th>Title</th><th>Group</th><th>Updated</th>` +
    `</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Show/hide the Relations tab based on whether the open task has any
// forward/reverse deps or parent/subtask relations. Isolated leaf tasks don't
// need the tab. Also flips activeTab off "relations" if the tab is hidden.
function updateRelationsTabVisibility() {
  const t = currentTask();
  const tab = document.querySelector('.modal-tab[data-tab="relations"]');
  if (!tab) return;
  if (!t) { tab.style.display = "none"; return; }
  const forwardCount = (t.depends_on || []).length;
  const reverseCount = allTasks.filter(x => (x.depends_on || []).includes(t.id)).length;
  const hasParent = !!t.parent_task_id;
  const subtaskCount = allTasks.filter(x => x.parent_task_id === t.id).length;
  const visible = forwardCount + reverseCount > 0 || hasParent || subtaskCount > 0;
  tab.style.display = visible ? "" : "none";
  if (!visible && activeTab === "relations") activeTab = "details";
}

// Render the modal Questions panel. Unresolved questions first (as bordered
// cards with per-card Answer / Resolve / Delete actions), then a "Resolved"
// header and the rest, dimmed. Answer editor is inline per card — toggled
// open by the Answer button so the panel isn't cluttered by empty forms.
function renderQuestions() {
  const t = currentTask();
  const container = document.getElementById("modal-questions");
  const questions = (t && t.questions) || [];
  if (!questions.length) {
    container.innerHTML = '<div class="q-empty">No questions on this task yet.</div>';
    return;
  }
  const open = questions.filter(q => !q.resolved);
  const resolved = questions.filter(q => q.resolved);
  const parts = [];
  parts.push('<div class="q-list">');
  for (const q of open) parts.push(renderQuestionCard(q));
  parts.push('</div>');
  if (resolved.length) {
    parts.push(`<div class="q-resolved-header">Resolved (${resolved.length})</div>`);
    parts.push('<div class="q-list">');
    for (const q of resolved) parts.push(renderQuestionCard(q));
    parts.push('</div>');
  }
  container.innerHTML = parts.join("");
  wireQuestionActions(container);
}

function renderQuestionCard(q) {
  const isResolved = !!q.resolved;
  const askedOf = q.asked_of || null;
  const askedBy = q.asked_by || null;
  // "self" styling when it's a question the current user (asked_of: user)
  // owes an answer to — draws the eye more than the default purple.
  const chipCls = askedOf === "user" ? "q-chip asked-of self" : "q-chip asked-of";
  const askedOfHtml = askedOf
    ? `<span class="${chipCls}" title="asked of ${escapeHtml(askedOf)}">→ ${escapeHtml(askedOf)}</span>`
    : "";
  const askedByHtml = askedBy
    ? `<span class="q-chip" title="asked by ${escapeHtml(askedBy)}">${escapeHtml(askedBy)}</span>`
    : "";
  const tsAbs = formatAbs(q.asked_at);
  const tsAbsShort = formatAbsShort(q.asked_at);
  const tsRel = formatRelTime(q.asked_at);
  const statusLabel = isResolved ? "Resolved" : "Open";
  const answerHtml = q.answer
    ? `<div class="q-answer">
         <div class="q-answer-label">answer${q.answered_by ? ` · ${escapeHtml(q.answered_by)}` : ""}${q.answered_at ? ` · <span title="${escapeHtml(formatAbs(q.answered_at))}">${escapeHtml(formatRelTime(q.answered_at))}<span class="ts-abs">${escapeHtml(formatAbsShort(q.answered_at))}</span></span>` : ""}<button type="button" class="card-copy" data-copy="answer" title="Copy answer markdown" aria-label="Copy answer markdown">copy</button></div>
         <div class="md-body">${window.renderMarkdown(q.answer)}</div>
       </div>`
    : "";
  const resolveLabel = isResolved ? "Reopen" : "Resolve";
  const answerBtn = isResolved
    ? ""  // Don't tempt editing an answer on a closed question; reopen first.
    : `<button type="button" class="icon-btn" data-q-action="answer" data-qid="${escapeHtml(q.id)}">${q.answer ? "Edit answer" : "Answer"}</button>`;
  return `
    <div class="q-card ${isResolved ? "resolved" : "open"}" data-qid="${escapeHtml(q.id)}">
      <div class="q-header" title="Click to collapse/expand">
        <span class="collapse-arrow">▼</span>
        <span class="q-id">${escapeHtml(q.id)}</span>
        ${askedByHtml}
        ${askedOfHtml}
        <span class="q-ts" title="${escapeHtml(tsAbs)}">${escapeHtml(tsRel)}<span class="ts-abs">${escapeHtml(tsAbsShort)}</span></span>
        <span class="q-status">${statusLabel}</span>
        <button type="button" class="card-copy" data-copy="question" title="Copy question markdown" aria-label="Copy question markdown">copy</button>
      </div>
      <div class="q-body md-body">${window.renderMarkdown(q.question || "")}</div>
      ${answerHtml}
      <form class="q-answer-form" data-qid="${escapeHtml(q.id)}">
        <textarea name="answer" placeholder="Write an answer…" required>${escapeHtml(q.answer || "")}</textarea>
        <div class="q-form-row">
          <label>as</label>
          <input type="text" name="answered_by" placeholder="claude" value="claude" />
          <span class="spacer"></span>
          <button type="button" class="icon-btn" data-q-action="answer-cancel" data-qid="${escapeHtml(q.id)}">Cancel</button>
          <button type="submit">Save answer</button>
        </div>
      </form>
      <div class="q-actions">
        ${answerBtn}
        <span class="spacer"></span>
        <button type="button" class="icon-btn" data-q-action="resolve" data-qid="${escapeHtml(q.id)}">${resolveLabel}</button>
        <button type="button" class="icon-btn danger" data-q-action="delete" data-qid="${escapeHtml(q.id)}">Delete</button>
      </div>
    </div>`;
}

function wireQuestionActions(container) {
  // Header click toggles the card's collapsed state. Cards default expanded.
  // Skip when the click is on the header's copy button — otherwise the flash
  // would race the collapse.
  container.querySelectorAll(".q-card > .q-header").forEach(hdr => {
    hdr.addEventListener("click", (e) => {
      if (e.target.closest(".card-copy")) return;
      hdr.parentElement.classList.toggle("collapsed");
    });
  });
  bindCopyButtons(container);
  container.querySelectorAll("[data-q-action]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      const qid = btn.dataset.qid;
      const action = btn.dataset.qAction;
      if (!openTaskId || !qid) return;
      if (action === "answer") {
        const form = container.querySelector(`form.q-answer-form[data-qid="${qid}"]`);
        if (form) {
          form.classList.add("open");
          const ta = form.querySelector('textarea[name="answer"]');
          if (ta) setTimeout(() => ta.focus(), 0);
        }
        return;
      }
      if (action === "answer-cancel") {
        const form = container.querySelector(`form.q-answer-form[data-qid="${qid}"]`);
        if (form) form.classList.remove("open");
        return;
      }
      if (action === "resolve") {
        const card = container.querySelector(`.q-card[data-qid="${qid}"]`);
        const isResolved = card && card.classList.contains("resolved");
        try {
          await apiSend("PATCH", `/api/tasks/${openTaskId}/questions/${qid}`, {resolved: !isResolved});
          await refresh();
          renderQuestions();
          renderModalTabs();
        } catch (err) { showError(err.message); }
        return;
      }
      if (action === "delete") {
        if (!confirm(`Delete question ${qid}?`)) return;
        try {
          await apiSend("DELETE", `/api/tasks/${openTaskId}/questions/${qid}`);
          await refresh();
          renderQuestions();
          renderModalTabs();
        } catch (err) { showError(err.message); }
        return;
      }
    });
  });
  container.querySelectorAll("form.q-answer-form").forEach(form => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const qid = form.dataset.qid;
      if (!openTaskId || !qid) return;
      const answer = form.answer.value.trim();
      const answered_by = form.answered_by.value.trim() || null;
      if (!answer) return;
      try {
        const body = {answer};
        if (answered_by) body.answered_by = answered_by;
        await apiSend("PATCH", `/api/tasks/${openTaskId}/questions/${qid}`, body);
        await refresh();
        renderQuestions();
        renderModalTabs();
      } catch (err) { showError(err.message); }
    });
  });
}

// Render the modal Review panel. Open items render first (bordered card with
// per-card Check / Dismiss / Edit / Delete actions), then a "Resolved" header
// and the rest, dimmed. Editor is inline per card — toggled by the Edit button.
function renderReviewItems() {
  const t = currentTask();
  const container = document.getElementById("modal-review-items");
  const items = (t && t.review_items) || [];
  if (!items.length) {
    container.innerHTML = '<div class="r-empty">No review items on this task yet. Add one to seed the checklist.</div>';
    return;
  }
  const open = items.filter(it => (it.status || "open") === "open");
  const resolved = items.filter(it => (it.status || "open") !== "open");
  const parts = [];
  parts.push('<div class="r-list">');
  for (const it of open) parts.push(renderReviewItemCard(it));
  parts.push('</div>');
  if (resolved.length) {
    parts.push(`<div class="r-resolved-header">Resolved (${resolved.length})</div>`);
    parts.push('<div class="r-list">');
    for (const it of resolved) parts.push(renderReviewItemCard(it));
    parts.push('</div>');
  }
  container.innerHTML = parts.join("");
  wireReviewItemActions(container);
}

function renderReviewItemCard(it) {
  const status = it.status || "open";
  const isOpen = status === "open";
  const cardCls = isOpen ? "open" : (status === "dismissed" ? "dismissed resolved" : "resolved");
  const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
  const author = it.author || null;
  const authorHtml = author
    ? `<span class="r-chip" title="added by ${escapeHtml(author)}">${escapeHtml(author)}</span>`
    : "";
  const tsAbs = formatAbs(it.created_at);
  const tsAbsShort = formatAbsShort(it.created_at);
  const tsRel = formatRelTime(it.created_at);
  const refHtml = it.ref
    ? `<div class="r-ref"><span class="r-ref-label">ref</span>${escapeHtml(it.ref)}</div>`
    : "";
  const resolvedMeta = !isOpen && (it.resolved_at || it.resolved_by)
    ? ` · ${status} ${it.resolved_by ? escapeHtml(it.resolved_by) + " " : ""}<span title="${escapeHtml(formatAbs(it.resolved_at))}">${escapeHtml(formatRelTime(it.resolved_at))}<span class="ts-abs">${escapeHtml(formatAbsShort(it.resolved_at))}</span></span>`
    : "";
  // Primary action depends on state. Open → Check (verified) is the common path;
  // Dismiss is secondary. Resolved → Reopen so the reviewer can un-check.
  const primaryBtn = isOpen
    ? `<button type="button" class="icon-btn primary" data-r-action="check" data-rid="${escapeHtml(it.id)}" title="Mark verified">Check</button>
       <button type="button" class="icon-btn" data-r-action="dismiss" data-rid="${escapeHtml(it.id)}" title="Skip — not worth checking">Dismiss</button>`
    : `<button type="button" class="icon-btn" data-r-action="reopen" data-rid="${escapeHtml(it.id)}" title="Reopen">Reopen</button>`;
  return `
    <div class="r-card ${cardCls}" data-rid="${escapeHtml(it.id)}">
      <div class="r-header" title="Click to collapse/expand">
        <span class="collapse-arrow">▼</span>
        <span class="r-id">${escapeHtml(it.id)}</span>
        ${authorHtml}
        <span class="r-ts" title="${escapeHtml(tsAbs)}">${escapeHtml(tsRel)}<span class="ts-abs">${escapeHtml(tsAbsShort)}</span>${resolvedMeta}</span>
        <span class="r-status">${statusLabel}</span>
        <button type="button" class="card-copy" data-copy="review" title="Copy markdown" aria-label="Copy review item markdown">copy</button>
      </div>
      <div class="r-body md-body">${window.renderMarkdown(it.body || "")}</div>
      ${refHtml}
      <form class="r-edit-form" data-rid="${escapeHtml(it.id)}">
        <textarea name="body" required>${escapeHtml(it.body || "")}</textarea>
        <input type="text" name="ref" placeholder="ref — file:line, scenario, test" value="${escapeHtml(it.ref || "")}" />
        <div class="r-edit-actions">
          <button type="button" class="icon-btn" data-r-action="edit-cancel" data-rid="${escapeHtml(it.id)}">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
      <div class="r-actions">
        ${primaryBtn}
        <span class="spacer"></span>
        <button type="button" class="icon-btn" data-r-action="edit" data-rid="${escapeHtml(it.id)}">Edit</button>
        <button type="button" class="icon-btn danger" data-r-action="delete" data-rid="${escapeHtml(it.id)}">Delete</button>
      </div>
    </div>`;
}

function wireReviewItemActions(container) {
  container.querySelectorAll(".r-card > .r-header").forEach(hdr => {
    hdr.addEventListener("click", (e) => {
      if (e.target.closest(".card-copy")) return;
      hdr.parentElement.classList.toggle("collapsed");
    });
  });
  bindCopyButtons(container);
  container.querySelectorAll("[data-r-action]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      const rid = btn.dataset.rid;
      const action = btn.dataset.rAction;
      if (!openTaskId || !rid) return;
      if (action === "edit") {
        const form = container.querySelector(`form.r-edit-form[data-rid="${rid}"]`);
        if (form) {
          form.classList.add("open");
          const ta = form.querySelector('textarea[name="body"]');
          if (ta) setTimeout(() => ta.focus(), 0);
        }
        return;
      }
      if (action === "edit-cancel") {
        const form = container.querySelector(`form.r-edit-form[data-rid="${rid}"]`);
        if (form) form.classList.remove("open");
        return;
      }
      if (action === "check" || action === "dismiss" || action === "reopen") {
        const status = action === "check" ? "checked"
          : action === "dismiss" ? "dismissed"
          : "open";
        try {
          const body = {status};
          if (status !== "open") body.resolved_by = "user";
          await apiSend("PATCH", `/api/tasks/${openTaskId}/review_items/${rid}`, body);
          await refresh();
          renderReviewItems();
          renderModalTabs();
          const t = currentTask();
          if (t) updateReviewButton(t);
        } catch (err) { showError(err.message); }
        return;
      }
      if (action === "delete") {
        if (!confirm(`Delete review item ${rid}?`)) return;
        try {
          await apiSend("DELETE", `/api/tasks/${openTaskId}/review_items/${rid}`);
          await refresh();
          renderReviewItems();
          renderModalTabs();
          const t = currentTask();
          if (t) updateReviewButton(t);
        } catch (err) { showError(err.message); }
        return;
      }
    });
  });
  container.querySelectorAll("form.r-edit-form").forEach(form => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rid = form.dataset.rid;
      if (!openTaskId || !rid) return;
      const body = form.body.value.trim();
      const ref = form.ref.value.trim();
      if (!body) return;
      try {
        await apiSend("PATCH", `/api/tasks/${openTaskId}/review_items/${rid}`, {
          body, ref: ref || null,
        });
        await refresh();
        renderReviewItems();
        renderModalTabs();
      } catch (err) { showError(err.message); }
    });
  });
}

// Wire up every `.card-copy[data-copy]` button under `container`. The button's
// `data-copy` value ("comment" | "question" | "answer" | "review") plus the
// closest card's `data-idx` / `data-qid` / `data-rid` are enough to look up
// the raw body from the current task. We resolve at click time (not render
// time) so the payload always reflects the latest task state.
function bindCopyButtons(container) {
  container.querySelectorAll(".card-copy[data-copy]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const body = resolveCopyPayload(btn);
      if (body == null) return;
      try {
        await navigator.clipboard.writeText(body);
        const original = btn.textContent;
        btn.textContent = "copied";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove("copied");
        }, 1000);
      } catch (err) {
        showError("Copy failed: " + err.message);
      }
    });
  });
}

function resolveCopyPayload(btn) {
  const kind = btn.dataset.copy;
  const t = currentTask();
  if (!t) return "";
  if (kind === "comment") {
    const card = btn.closest(".comment");
    const idx = card && Number(card.dataset.idx);
    return (t.comments && t.comments[idx] && t.comments[idx].body) || "";
  }
  if (kind === "question" || kind === "answer") {
    const card = btn.closest(".q-card");
    const qid = card && card.dataset.qid;
    const q = (t.questions || []).find(x => x.id === qid);
    if (!q) return "";
    return kind === "answer" ? (q.answer || "") : (q.question || "");
  }
  if (kind === "review") {
    const card = btn.closest(".r-card");
    const rid = card && card.dataset.rid;
    const it = (t.review_items || []).find(x => x.id === rid);
    return (it && it.body) || "";
  }
  return "";
}

function renderComments() {
  const t = currentTask();
  const container = document.getElementById("modal-comments");
  const comments = (t && t.comments) || [];
  if (!comments.length) {
    container.innerHTML = '<div class="empty">No comments yet.</div>';
    return;
  }
  container.innerHTML = comments.map((c, i) => `
    <div class="comment" data-idx="${i}" data-ts="${escapeHtml(c.ts || "")}">
      <div class="comment-header" title="Click to collapse/expand">
        <span class="collapse-arrow">▼</span>
        <span class="comment-index">#${i + 1}</span>
        ${c.author ? `<span class="comment-author">${escapeHtml(c.author)}</span>` : ""}
        <span class="comment-ts" title="${escapeHtml(formatAbs(c.ts))}">${escapeHtml(formatRelTime(c.ts))}<span class="ts-abs">${escapeHtml(formatAbsShort(c.ts))}</span></span>
        <button type="button" class="card-copy" data-copy="comment" title="Copy markdown" aria-label="Copy comment markdown">copy</button>
        <button type="button" class="comment-delete" title="Delete comment" aria-label="Delete comment">×</button>
      </div>
      <div class="comment-body md-body">${window.renderMarkdown(c.body || "")}</div>
    </div>
  `).join("");
  container.querySelectorAll(".comment-header").forEach(hdr => {
    hdr.addEventListener("click", (e) => {
      // Clicking the delete × or copy button shouldn't also toggle the collapse.
      if (e.target.closest(".comment-delete")) return;
      if (e.target.closest(".card-copy")) return;
      hdr.parentElement.classList.toggle("collapsed");
    });
  });
  bindCopyButtons(container);
  container.querySelectorAll(".comment-delete").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const card = btn.closest(".comment");
      const ts = card && card.dataset.ts;
      const idx = card && card.dataset.idx;
      if (!openTaskId || !ts) return;
      if (!confirm(`Delete comment #${(Number(idx) || 0) + 1}? This can't be undone.`)) return;
      try {
        await apiSend("DELETE", `/api/tasks/${openTaskId}/comments/${encodeURIComponent(ts)}`);
        await refresh();
        renderComments();
        renderModalTabs();
      } catch (err) { showError(err.message); }
    });
  });
}

// Toggle the "Mark reviewed" footer button based on the current task's
// review state. Reviewed → button becomes "Mark unreviewed"; unreviewed
// or flagged → "Mark reviewed".
function updateReviewButton(t) {
  const btn = document.getElementById("modal-mark-reviewed");
  if (!t) { btn.style.display = "none"; return; }
  btn.style.display = "";
  if (t.reviewed_at != null) {
    btn.textContent = "Mark unreviewed";
    btn.dataset.action = "unmark";
    btn.title = `Reviewed ${formatRelTime(t.reviewed_at)} (${formatAbs(t.reviewed_at)})`;
  } else {
    btn.textContent = t.needs_review ? "Mark reviewed ●" : "Mark reviewed";
    btn.dataset.action = "mark";
    btn.title = t.needs_review ? "Clear the review flag and record 'reviewed just now'" : "Record 'reviewed just now'";
  }
}

// Search input.
document.getElementById("search-input").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  tasksPage = 1;
  updateSidebarFooter();
  renderTasks();
});

// Sidebar filter widgets. Each tri-state axis is a custom listbox: click a
// row to cycle its state (unapplied → include → exclude → unapplied). We
// re-render the whole axis on each click rather than mutating one row so
// the state ↔ visual mapping stays in one place (`populateTri`).
function wireTriFilter(elId, tri, valuesFn, labelCountFns) {
  const el = document.getElementById(elId);
  el.addEventListener("click", (e) => {
    const row = e.target.closest(".tri-row");
    if (!row || !el.contains(row)) return;
    cycleTri(tri, row.dataset.value);
    tasksPage = 1;
    populateTri(elId, valuesFn(), tri, labelCountFns());
    updateSidebarFooter();
    renderTasks();
  });
}
// Value/label/count resolvers mirror renderSidebar so a per-row re-render
// stays consistent with the initial paint. Kept as thunks so counts pick
// up the current allTasks / byId snapshot on each click.
function _statusValues() { return STATUSES.filter(s => s !== "all"); }
function _statusFns() {
  const byId = Object.fromEntries(allTasks.map(t => [t.id, t]));
  return {
    label: v => v.replace("_", " "),
    count: v => allTasks.filter(t => statusMatchesValue(t, v, byId)).length,
  };
}
function _priorityValues() { return PRIORITY_OPTIONS; }
function _priorityFns() {
  return {
    label: v => `${v} · ${PRIORITY_LABELS[v]}`,
    count: v => allTasks.filter(t => priorityValueOf(t) === v).length,
  };
}
function _ageValues() { return AGE_BUCKETS.map(b => b.key); }
function _ageFns() {
  return {
    label: v => (AGE_BUCKETS.find(b => b.key === v) || {label: v}).label,
    count: v => allTasks.filter(t => ageBucketFor(t.created_at) === v).length,
  };
}
function _groupValues() {
  const g = knownGroups();
  return g.length ? [...g, "__ungrouped__"] : g;
}
function _groupFns() {
  return {
    label: v => v === "__ungrouped__" ? "(ungrouped)" : v,
    count: v => allTasks.filter(t => groupMatchesValue(t, v)).length,
  };
}
function _tagValues() {
  const g = knownTags();
  return g.length ? [...g, "__untagged__"] : g;
}
function _tagFns() {
  return {
    label: v => v === "__untagged__" ? "(untagged)" : v,
    count: v => allTasks.filter(t => tagMatchesValue(t, v)).length,
  };
}
function _reviewValues() { return REVIEW_OPTIONS; }
function _reviewFns() {
  return {
    label: v => REVIEW_LABELS[v] || v,
    count: v => allTasks.filter(t => reviewMatchesValue(t, v)).length,
  };
}
function _pinnedValues() { return PINNED_OPTIONS; }
function _pinnedFns() {
  return {
    label: v => PINNED_LABELS[v] || v,
    count: v => allTasks.filter(t => pinnedMatchesValue(t, v)).length,
  };
}
wireTriFilter("f-status",   activeStatus,   _statusValues,   _statusFns);
wireTriFilter("f-priority", activePriority, _priorityValues, _priorityFns);
wireTriFilter("f-review",   activeReview,   _reviewValues,   _reviewFns);
wireTriFilter("f-pinned",   activePinned,   _pinnedValues,   _pinnedFns);
wireTriFilter("f-age",      activeAge,      _ageValues,      _ageFns);
wireTriFilter("f-group",    activeGroup,    _groupValues,    _groupFns);
wireTriFilter("f-tag",      activeTag,      _tagValues,      _tagFns);

// Header needs-review chip: click toggles include-`needs` in the Review
// tri. Only touches the `needs` value — any include/exclude choices on
// `reviewed`/`unreviewed` are preserved.
document.getElementById("btn-needs-review").addEventListener("click", () => {
  if (activeReview.inc.has("needs")) activeReview.inc.delete("needs");
  else { activeReview.exc.delete("needs"); activeReview.inc.add("needs"); }

});

// Header pinned chip: click toggles include-`pinned` in the Pinned tri.
// Preserves any exclude selection on `unpinned`.
document.getElementById("btn-pinned").addEventListener("click", () => {
  if (activePinned.inc.has("pinned")) activePinned.inc.delete("pinned");
  else { activePinned.exc.delete("pinned"); activePinned.inc.add("pinned"); }

  renderSidebar();
  renderTasks();
});

  sidebarCollapsed = !sidebarCollapsed;

  applySidebarCollapsed();

// Clear all filters.
function clearTri(tri) { tri.inc.clear(); tri.exc.clear(); }
document.getElementById("sidebar-clear").addEventListener("click", () => {

// Tab switching.
document.querySelectorAll(".modal-tab").forEach(btn => {

});

// Body view/edit toggle.
document.getElementById("modal-body-edit").addEventListener("click", () => {
