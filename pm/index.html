// Close handlers.
document.getElementById("modal-close").addEventListener("click", closeTaskModal);
document.getElementById("task-modal").addEventListener("click", (e) => {
  if (e.target.id === "task-modal") closeTaskModal();
});
document.addEventListener("keydown", (e) => {
  // "?" is handled by the shared help-modal module. Here we only own the
  // Esc chain for our own sibling modals.
  if (e.key !== "Escape") return;
  // Topmost first: help modal wins if open, then the task modal.
  if (window.helpIsOpen && window.helpIsOpen()) window.helpClose();
  else if (document.getElementById("task-modal").classList.contains("open")) closeTaskModal();
});

function flashSave(msg, isError = false) {
  const el = document.getElementById("modal-save-flash");
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.classList.add("show");
  clearTimeout(flashSave._t);
  flashSave._t = setTimeout(() => el.classList.remove("show"), 1800);
}

// Save handler — dual mode. Edit: PATCH and keep modal open with Saved ✓ flash.
// Create: POST, then close modal (so user sees the new row in the list).
// Persist draft on every keystroke / change while the create modal is open.
// No-op in edit mode (edits PATCH straight to the server).
document.getElementById("modal-edit-form").addEventListener("input", saveNewTaskDraft);
document.getElementById("modal-edit-form").addEventListener("change", saveNewTaskDraft);

document.getElementById("modal-edit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const payload = {
    title: f.title.value.trim(),
    priority: f.priority.value,
    group: f.group.value.trim() || null,
    tags: parseCsv(f.tags.value),
    assignee: f.assignee.value.trim() || null,
    depends_on: parseCsv(f.depends_on.value),
    parent_task_id: f.parent_task_id.value.trim() || null,
    body: f.body.value,
  };
  const btn = f.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;
  try {
    if (modalMode === "create") {
      // status is not accepted by POST (server defaults to open); strip it.
      const post = {...payload};
      // POST expects `assignee` as string|undefined (not null) to leave unassigned.
      if (post.assignee === null) delete post.assignee;
      if (post.group === null) delete post.group;
      if (post.parent_task_id === null) delete post.parent_task_id;
      const created = await apiSend("POST", "/api/tasks", post);
      // If the user chose a non-default status in the create form, patch it now.
      if (f.status.value && f.status.value !== "open") {
        await apiSend("PATCH", `/api/tasks/${created.id}`, {status: f.status.value});
      }
      clearNewTaskDraft();
      await refresh();
      closeTaskModal();
    } else {
      if (!openTaskId) return;
      const patch = {...payload, status: f.status.value};
      await apiSend("PATCH", `/api/tasks/${openTaskId}`, patch);
      await refresh();
      flashSave("Saved ✓");
      setBodyMode("view");
    }
  } catch (err) {
    console.error("modal submit failed:", err, "mode:", modalMode, "payload:", payload);
    flashSave(`${modalMode === "create" ? "Create" : "Save"} failed: ${err.message}`, true);
    showError(err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
});

// Mark reviewed / unreviewed.
document.getElementById("modal-mark-reviewed").addEventListener("click", async () => {
  if (!openTaskId) return;
  const btn = document.getElementById("modal-mark-reviewed");
  const action = btn.dataset.action;
  btn.disabled = true;
  try {
    const patch = action === "unmark" ? {reviewed_at: null} : {reviewed_at: "now"};
    await apiSend("PATCH", `/api/tasks/${openTaskId}`, patch);
    await refresh();
    const t = currentTask();
    if (t) updateReviewButton(t);
    flashSave(action === "unmark" ? "Cleared review" : "Reviewed ✓");
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
  }
});

// Delete handler.
document.getElementById("modal-delete").addEventListener("click", async () => {
  if (!openTaskId) return;
  const t = currentTask();
  if (!confirm(`Delete ${t.id} · "${t.title}"? This cannot be undone.`)) return;
  try {
    await apiSend("DELETE", `/api/tasks/${openTaskId}`);
    await refresh();
    closeTaskModal();
  } catch (err) {
    showError(err.message);
  }
});

// Ask question.
document.getElementById("modal-question-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!openTaskId) return;
  const f = e.target;
  const question = f.question.value.trim();
  if (!question) return;
  const asked_of = f.asked_of.value || null;
  const asked_by = f.asked_by.value.trim() || null;
  try {
    const body = {question};
    if (asked_of !== null) body.asked_of = asked_of;
    if (asked_by !== null) body.asked_by = asked_by;
    await apiSend("POST", `/api/tasks/${openTaskId}/questions`, body);
    f.question.value = "";
    await refresh();
    renderQuestions();
    renderModalTabs();
  } catch (err) {
    showError(err.message);
  }
});

// Add review item.
document.getElementById("modal-review-item-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!openTaskId) return;
  const f = e.target;
  const body = f.body.value.trim();
  if (!body) return;
  const ref = f.ref.value.trim() || null;
  const author = f.author.value.trim() || null;
  try {
    const payload = {body};
    if (ref !== null) payload.ref = ref;
    if (author !== null) payload.author = author;
    await apiSend("POST", `/api/tasks/${openTaskId}/review_items`, payload);
    f.body.value = "";
    f.ref.value = "";
    await refresh();
    renderReviewItems();
    renderModalTabs();
    const t = currentTask();
    if (t) updateReviewButton(t);
  } catch (err) {
    showError(err.message);
  }
});

// Comment post.
document.getElementById("modal-comment-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!openTaskId) return;
  const f = e.target;
  const body = f.body.value.trim();
  if (!body) return;
  try {
    await apiSend("POST", `/api/tasks/${openTaskId}/comments`, {body});
    f.reset();
    await refresh();
    // Re-render comments on the still-open modal.
    renderComments();
    renderModalTabs();
  } catch (err) {
    showError(err.message);
  }
});

function parseCsv(s) {
  return (s || "").split(",").map(x => x.trim()).filter(Boolean);
}

// Header button opens the create modal.
document.getElementById("btn-new-task").addEventListener("click", openTaskCreateModal);

// ── URL state sync ──
// State that survives page reloads is written to location.search. Only
// non-default values are serialized so a clean view yields a clean URL.
// Tri-state axes serialize as CSV with an optional `-` prefix marking
// exclude entries (e.g. `status=open,-done`). Order within the CSV is
// insignificant. Populate an existing tri (never allocate a new one —
// see the tri comment above for why).
function resetTriFromCsv(tri, s, filterFn) {
  tri.inc.clear();
  tri.exc.clear();
  for (const raw of (s || "").split(",")) {
    const t = raw.trim();
    if (!t) continue;
    const excl = t.startsWith("-");
    const v = excl ? t.slice(1) : t;
    if (!v) continue;
    if (filterFn && !filterFn(v)) continue;
    (excl ? tri.exc : tri.inc).add(v);
  }
}
function csvFromTri(tri) {
  const parts = [];
  for (const v of tri.inc) parts.push(v);
  for (const v of tri.exc) parts.push(`-${v}`);
  return parts.join(",");
}
function parseUrl() {
  const p = new URLSearchParams(location.search);
  if (p.has("status")) resetTriFromCsv(activeStatus, p.get("status"));
  if (p.has("pri")) resetTriFromCsv(activePriority, p.get("pri"));
  if (p.has("group")) resetTriFromCsv(activeGroup, p.get("group"));
  if (p.has("tag")) resetTriFromCsv(activeTag, p.get("tag"));
  if (p.has("age")) {
    const valid = new Set(AGE_BUCKETS.map(b => b.key));
    resetTriFromCsv(activeAge, p.get("age"), v => valid.has(v));
  }
  if (p.has("review")) {
    const valid = new Set(REVIEW_OPTIONS);
    resetTriFromCsv(activeReview, p.get("review"), v => valid.has(v));
  }
  if (p.has("pinned")) {
    const valid = new Set(PINNED_OPTIONS);
    resetTriFromCsv(activePinned, p.get("pinned"), v => valid.has(v));
  }
  if (p.has("q")) searchQuery = p.get("q");
  if (p.has("sort")) {
    const [key, dir] = p.get("sort").split(":");
    if (key) taskSort = {key, dir: dir === "asc" ? "asc" : "desc"};
  }
  if (p.has("page")) {
    const n = parseInt(p.get("page"), 10);
    if (n >= 1) tasksPage = n;
  }
  if (p.has("task")) openTaskId = p.get("task");
  if (p.get("new") === "1") modalMode = "create";
  // Reflect the parsed search into the input immediately.
  const searchInput = document.getElementById("search-input");
  if (searchInput) searchInput.value = searchQuery;
}

function syncUrl() {
  const p = new URLSearchParams();
  if (triActive(activeStatus)) p.set("status", csvFromTri(activeStatus));
  if (triActive(activePriority)) p.set("pri", csvFromTri(activePriority));
  if (triActive(activeGroup)) p.set("group", csvFromTri(activeGroup));
  if (triActive(activeTag)) p.set("tag", csvFromTri(activeTag));
  if (triActive(activeAge)) p.set("age", csvFromTri(activeAge));
  if (triActive(activeReview)) p.set("review", csvFromTri(activeReview));
  if (triActive(activePinned)) p.set("pinned", csvFromTri(activePinned));
  if (searchQuery) p.set("q", searchQuery);
  if (taskSort.key !== "updated_at" || taskSort.dir !== "desc") {
    p.set("sort", `${taskSort.key}:${taskSort.dir}`);
  }
  if (tasksPage > 1) p.set("page", String(tasksPage));
  if (openTaskId) p.set("task", openTaskId);
  if (modalMode === "create" && !openTaskId) p.set("new", "1");
  const qs = p.toString();
  const next = location.pathname + (qs ? "?" + qs : "");
  if (next !== location.pathname + location.search) {
    history.replaceState(null, "", next);
  }
}

window.addEventListener("popstate", () => {
  parseUrl();
  renderSidebar();
  renderTasks();
  if (openTaskId) openTaskModal(openTaskId);
  else if (modalMode === "create") openTaskCreateModal();
  else closeTaskModal();
});

// ── boot ──
async function refresh() {
  try {
    const tasks = await apiGet("/api/tasks");
    allTasks = tasks;
    renderSidebar();
    renderTasks();
    // Restore an open modal from the URL after initial data load.
    if (openTaskId && !document.getElementById("task-modal").classList.contains("open")) {
      openTaskModal(openTaskId);
    } else if (modalMode === "create" && !openTaskId &&
               !document.getElementById("task-modal").classList.contains("open")) {
      openTaskCreateModal();
    }
    // Refresh the open task modal's data too.
    if (openTaskId) {
      const t = currentTask();
      if (!t) closeTaskModal();
      else {
        document.getElementById("modal-title").textContent = t.title || "(untitled)";
        document.getElementById("modal-meta").innerHTML =
          `created <span title="${escapeHtml(formatAbs(t.created_at))}">${escapeHtml(formatRelTime(t.created_at))}</span>` +
          ` · updated <span title="${escapeHtml(formatAbs(t.updated_at))}">${escapeHtml(formatRelTime(t.updated_at))}</span>`;
        renderComments();
        renderQuestions();
        renderReviewItems();
        updateRelationsTabVisibility();
        renderModalTabs();
        renderRelations();
        updateReviewButton(t);
      }
    }
  } catch (e) {
    showError(`Failed to load: ${e.message}`);
  }
}

try { sidebarCollapsed = localStorage.getItem("pm.sidebar.collapsed") === "1"; } catch {}
applySidebarCollapsed();
parseUrl();
refresh();
</script>
